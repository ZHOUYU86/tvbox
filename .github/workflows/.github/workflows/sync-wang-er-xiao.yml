name: sync-wang-er-xiao

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: curl -L -o wang-er-xiao.json https://9280.kstore.space/wex.json
      - name: Commit
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add wang-er-xiao.json
          git diff --staged --quiet || git commit -m "sync wang er xiao"
          git push
