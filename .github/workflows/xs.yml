name: sync xs config

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download xs config and spider.jar
        run: |
          mkdir -p xs
          curl -L -o xs/api.json "https://raw.githubusercontent.com/qist/tvbox/refs/heads/master/xiaosa/api.json"
          curl -L -o xs/spider.jar "https://raw.githubusercontent.com/qist/tvbox/refs/heads/master/xiaosa/spider.jar"

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add xs/
          git diff --staged --quiet || git commit -m "auto sync xs config"
          git push
