name: wex
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载上游配置
        run: curl -sL "https://9280.kstore.space/wex.json" -o wex_raw.json
      - name: 写清理脚本
        run: |
          cat > clean.py << 'PYEOF'
          import re, json
          with open('wex_raw.json', 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r',\s*\{\s*"key":\s*"push_agent".*?\}', '', content, flags=re.DOTALL)
          content = re.sub(r'"ads":\s*\[.*?\]', '"ads": []', content, flags=re.DOTALL)
          content = re.sub(r'"wallpaper":\s*"[^"]*"', '"wallpaper": ""', content)
          content = re.sub(r'"spider":\s*"[^"]*"', '"spider": "http://oss4liview.moji.com/thd_file/2026/09/24/06cf2230c30d9c26fa46ea79147b330d.jpg;md5;fc8f993c9297d38139363cd0e3db9853"', content)
          with open('wex.json', 'w', encoding='utf-8') as f:
              f.write(content)
          d = json.loads(content)
          print(f'清理完成: 源={len(d["sites"])}, 广告={len(d["ads"])}, wallpaper空')
          PYEOF
      - name: 执行清理
        run: python3 clean.py
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wex.json
          git commit -m "自动同步王二小配置(去广告)" || echo "无变化"
          git push
