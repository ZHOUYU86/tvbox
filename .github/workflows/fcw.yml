name: Sync FanchangWang Config

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone source repo
        run: |
          git clone --depth 1 https://github.com/FanchangWang/tvbox_config.git source_repo

      - name: Copy config files
        run: |
          mkdir -p fcw
          cp -f source_repo/dist/tvbox.json fcw/tvbox.json
          cp -f source_repo/dist/my.json fcw/my.json

      - name: Commit and push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add fcw/
          git commit -m "Auto update fcw config" || echo "No changes"
          git push
