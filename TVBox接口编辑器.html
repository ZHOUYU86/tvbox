<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVBox 接口地址编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .back-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #1677ff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(22,119,255,0.4);
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 26px;
        }
        .subtitle {
            color: rgba(255,255,255,0.8);
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .tip {
            background: rgba(255,255,255,0.15);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.6;
        }
        .source-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .source-card.adult {
            border: 2px solid #1677ff;
        }
        .source-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .source-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .url-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        .url-label {
            min-width: 70px;
            font-size: 13px;
            font-weight: bold;
            color: #666;
            flex-shrink: 0;
        }
        .url-label.online1 { color: #3b82f6; }
        .url-label.online2 { color: #8b5cf6; }
        .url-label.local { color: #10b981; }
        .url-input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            font-family: Consolas, monospace;
            background: #fff;
            color: #222;
            min-width: 0;
            transition: border-color 0.2s;
        }
        .url-input:focus {
            outline: none;
            border-color: #1677ff;
        }
        .copy-btn {
            padding: 10px 18px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .copy-btn:hover { background: #2563eb; }
        .copy-btn.copied { background: #10b981; }
        .copy-btn.online2 { background: #8b5cf6; }
        .copy-btn.online2:hover { background: #7c3aed; }
        .copy-btn.local { background: #10b981; }
        .copy-btn.local:hover { background: #059669; }
        .actions {
            text-align: center;
            margin: 20px 0;
        }
        .action-btn {
            padding: 12px 30px;
            margin: 0 5px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn.save {
            background: #10b981;
            color: white;
        }
        .action-btn.save:hover { background: #059669; }
        .action-btn.reset {
            background: #f59e0b;
            color: white;
        }
        .action-btn.reset:hover { background: #d97706; }
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            margin-top: 30px;
            font-size: 12px;
        }
        @media (max-width: 600px) {
            .url-row {
                flex-wrap: wrap;
                gap: 8px;
            }
            .url-label {
                width: 100%;
                font-size: 14px;
            }
            .url-input {
                flex: 1 1 100%;
                padding: 12px 14px;
                font-size: 14px;
            }
            .copy-btn {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="text-align:center;margin-bottom:15px;">
            <a href="index.html" class="back-btn">← 返回导航主页</a>
        </div>
        <h1>📝 TVBox 接口地址编辑器</h1>
        <p class="subtitle">直接修改下面的地址，改完点复制就能用！自动保存到本地</p>
        
        <div class="tip">
            💡 <strong>使用说明：</strong>直接点击输入框修改地址，修改后会自动保存到浏览器本地。
            点右边的"复制"按钮就能复制地址，然后粘贴到TVBox的配置地址里。
            刷新页面不会丢失修改！点"恢复默认"可以还原原始地址。
        </div>

        <div class="actions">
            <button class="action-btn save" onclick="saveAll()">💾 保存修改</button>
            <button class="action-btn reset" onclick="resetAll()">🔄 恢复默认</button>
        </div>

        <div id="sources"></div>

        <div style="text-align:center;margin:20px 0;">
            <a href="index.html" class="back-btn">← 返回导航主页</a>
        </div>

        <div class="footer">
            TVBox 接口地址编辑器 | 修改自动保存 | 共 <span id="count">0</span> 个接口
        </div>
    </div>

    <script>
        const ONLINE1 = "https://zhouyu365666.top";
        const ONLINE2 = "https://tvbox-bh1.pages.dev";
        const LOCAL = "http://10.144.194.238:8080";

        const defaultSources = [
            { name: "小洒 (xs)", en: "xs" },
            { name: "FTY (fty)", en: "fty" },
            { name: "王二小 (wex)", en: "wex" },
            { name: "南风 (nf)", en: "nf" },
            { name: "肥猫 (feimao)", en: "feimao" },
            { name: "CL (cl)", en: "cl" },
            { name: "欧阳 (ouyang)", en: "ouyang" },
            { name: "鲁宾 (lubin)", en: "lubin" },
            { name: "东篱 (dl)", en: "dl" },
            { name: "TVURL (tvurl)", en: "tvurl" },
        ];

        const adultSource = {
            name: "🔞 合并配置18（私密接口）",
            en: "tvbox18",
            isAdult: true,
            urls: {
                online1: ONLINE1 + "/assets/static/data/tvbox18.json",
                online2: ONLINE2 + "/assets/static/data/tvbox18.json",
                local: LOCAL + "/tvbox18/api.json"
            }
        };

        function getSavedUrls() {
            try {
                return JSON.parse(localStorage.getItem('tvbox_editor_urls') || '{}');
            } catch(e) {
                return {};
            }
        }

        function saveUrls(urls) {
            localStorage.setItem('tvbox_editor_urls', JSON.stringify(urls));
        }

        function getUrl(en, type, defaultUrl) {
            const saved = getSavedUrls();
            if (saved[en] && saved[en][type]) {
                return saved[en][type];
            }
            return defaultUrl;
        }

        function setUrl(en, type, url) {
            const saved = getSavedUrls();
            if (!saved[en]) saved[en] = {};
            saved[en][type] = url;
            saveUrls(saved);
        }

        function renderSources() {
            const container = document.getElementById('sources');
            container.innerHTML = '';
            
            // 普通接口
            defaultSources.forEach(src => {
                const card = createCard(src, false);
                container.appendChild(card);
            });
            
            // 成人接口
            const adultCard = createAdultCard(adultSource);
            container.appendChild(adultCard);
            
            document.getElementById('count').textContent = defaultSources.length + 1;
        }

        function createCard(src, isAdult) {
            const card = document.createElement('div');
            card.className = 'source-card' + (isAdult ? ' adult' : '');
            
            const urlTypes = [
                { key: 'online1', label: '在线1', cls: 'online1', url: `${ONLINE1}/${src.en}/api.json` },
                { key: 'online2', label: '在线2', cls: 'online2', url: `${ONLINE2}/${src.en}/api.json` },
                { key: 'local', label: '本地', cls: 'local', url: `${LOCAL}/${src.en}/api.json` }
            ];
            
            let urlRows = '';
            urlTypes.forEach(ut => {
                const savedUrl = getUrl(src.en, ut.key, ut.url);
                urlRows += `
                    <div class="url-row">
                        <span class="url-label ${ut.cls}">${ut.label}</span>
                        <input type="text" class="url-input" value="${savedUrl}" 
                               onchange="setUrl('${src.en}', '${ut.key}', this.value)"
                               oninput="setUrl('${src.en}', '${ut.key}', this.value)">
                        <button class="copy-btn ${ut.cls}" onclick="copyUrl(this)">复制</button>
                    </div>
                `;
            });
            
            card.innerHTML = `
                <div class="source-header">
                    <div class="source-name">${src.name}</div>
                </div>
                ${urlRows}
            `;
            return card;
        }

        function createAdultCard(src) {
            const card = document.createElement('div');
            card.className = 'source-card adult';
            
            const urlTypes = [
                { key: 'online1', label: '在线1', cls: 'online1', url: src.urls.online1 },
                { key: 'online2', label: '在线2', cls: 'online2', url: src.urls.online2 },
                { key: 'local', label: '本地', cls: 'local', url: src.urls.local }
            ];
            
            let urlRows = '';
            urlTypes.forEach(ut => {
                const savedUrl = getUrl(src.en, ut.key, ut.url);
                urlRows += `
                    <div class="url-row">
                        <span class="url-label ${ut.cls}">${ut.label}</span>
                        <input type="text" class="url-input" value="${savedUrl}" 
                               onchange="setUrl('${src.en}', '${ut.key}', this.value)"
                               oninput="setUrl('${src.en}', '${ut.key}', this.value)">
                        <button class="copy-btn ${ut.cls}" onclick="copyUrl(this)">复制</button>
                    </div>
                `;
            });
            
            card.innerHTML = `
                <div class="source-header">
                    <div class="source-name">${src.name}</div>
                </div>
                ${urlRows}
            `;
            return card;
        }

        function copyUrl(btn) {
            const input = btn.parentElement.querySelector('.url-input');
            input.select();
            document.execCommand('copy');
            
            const originalText = btn.textContent;
            btn.textContent = '✓ 已复制';
            btn.classList.add('copied');
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.remove('copied');
            }, 1500);
        }

        function saveAll() {
            alert('✅ 所有修改已自动保存到浏览器本地！\n\n刷新页面不会丢失，点"恢复默认"可以还原。');
        }

        function resetAll() {
            if (confirm('确定要恢复所有默认地址吗？你修改过的地址都会还原。')) {
                localStorage.removeItem('tvbox_editor_urls');
                renderSources();
                alert('✅ 已恢复默认地址！');
            }
        }

        // 初始渲染
        renderSources();
    </script>
</body>
</html>
