<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #0a0e27 0%, #1a1f3a 30%, #2d3561 60%, #1e3a5f 100%);
            background-size: 100% 100%;
            color: #fff;
            position: relative;
        }

        /* 颗粒感噪点层 - 加强版 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='5' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
        }

        /* 动态背景 - 慢慢转动的光晕 */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: rotateGlow 20s linear infinite;
        }

        .bg-glow:nth-child(1) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #1e3a8a, transparent);
            top: -200px;
            left: -200px;
            animation-duration: 25s;
        }

        .bg-glow:nth-child(2) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #3b82f6, transparent);
            bottom: -150px;
            right: -150px;
            animation-duration: 30s;
            animation-direction: reverse;
        }

        .bg-glow:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #60a5fa, transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 35s;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* 星星背景 */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        /* 流星效果 */
        .meteor {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.5);
            animation: meteorFall linear infinite;
        }

        .meteor::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, #fff, transparent);
            transform: translateX(-100px) translateY(-50%);
            transform-origin: right center;
        }

        @keyframes meteorFall {
            0% {
                transform: translate(0, 0) rotate(-45deg);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translate(-500px, 500px) rotate(-45deg);
                opacity: 0;
            }
        }


        /* 页面容器 - 翻书特效 */
        .pages-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            perspective: 2000px;
            overflow: hidden;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: inherit;
            transform-origin: top center;
            transform: rotateX(0deg) translateZ(0);
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.8s ease;
            backface-visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .page.active {
            opacity: 1;
            transform: rotateX(0deg) translateZ(0);
            pointer-events: auto;
            z-index: 10;
        }

        .page.flipped {
            opacity: 0;
            transform: rotateX(-180deg) translateZ(-100px);
            z-index: 5;
        }

        .page.next-up {
            opacity: 0;
            transform: rotateX(180deg) translateZ(-100px);
            z-index: 5;
        }

        /* 翻页阴影效果 */
        .page::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent 30%);
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }

        .page.flipping::after {
            opacity: 1;
        }

        /* 翻页指示器 */
        .page-indicator {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .indicator-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .indicator-dot.active {
            background: #a78bfa;
            border-color: #fff;
            transform: scale(1.3);
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.6);
        }

        .indicator-dot:hover {
            background: rgba(255,255,255,0.6);
        }

        /* ========== 第一页：时间 + 音乐播放器 ========== */
        .time-display-large {
            font-size: 72px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.5);
            letter-spacing: 6px;
            margin-bottom: 5px;
        }

        .date-display-large {
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* KTV风格音乐播放器 - 缩小版 */
        .ktv-player {
            width: 100%;
            max-width: 550px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        /* 图片轮播区域 - 缩小版 */
        .ktv-image-slider {
            width: 100%;
            height: 220px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .slider-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.8s ease, transform 5s ease;
            transform: scale(1);
        }

        .slider-image.active {
            opacity: 1;
            transform: scale(1.08);
        }

        /* 图片切换闪烁效果 */
        .slider-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .slider-flash.flash {
            animation: flashEffect 0.5s ease;
        }

        @keyframes flashEffect {
            0% { opacity: 0; }
            50% { opacity: 0.6; }
            100% { opacity: 0; }
        }

        .ktv-song-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .ktv-song-title {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .ktv-song-artist {
            font-size: 18px;
            color: rgba(255,255,255,0.6);
        }

        /* KTV歌词显示 - 超简单可靠版 */
        .ktv-lyrics {
            height: 45px;
            margin-bottom: 15px;
            position: relative;
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        /* 歌词文字 - 白色，肯定能看见 */
        .lyric-text {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            padding: 0 15px;
            white-space: nowrap;
            position: relative;
            z-index: 1;
            width: 100%;
            text-align: center;
        }

        /* 蓝色唱过进度条 - 从左往右慢慢跑 */
        .lyric-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(29,78,216,0.5), rgba(59,130,246,0.3));
            z-index: 2;
        }

        /* 蓝色光标 - 跟着进度条跑 */
        .lyric-cursor {
            position: absolute;
            top: 5px;
            bottom: 5px;
            width: 4px;
            background: #1d4ed8;
            box-shadow: 0 0 12px #1d4ed8, 0 0 20px rgba(29,78,216,0.6);
            border-radius: 2px;
            left: 0;
            z-index: 3;
            display: none;
        }

        .lyric-cursor.show {
            display: block;
        }

        /* 播放控制 */
        .ktv-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
        }

        .ktv-control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .ktv-control-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }

        .ktv-control-btn.play-btn {
            width: 70px;
            height: 70px;
            font-size: 28px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        .ktv-control-btn.play-btn:hover {
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.6);
        }

        /* 进度条 */
        .ktv-progress {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 15px;
            position: relative;
        }

        .ktv-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #6366f1);
            border-radius: 3px;
            width: 0%;
            position: relative;
        }

        .ktv-progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.8);
        }

        .ktv-time {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }

        /* 播放列表按钮 */
        .ktv-playlist-toggle {
            text-align: center;
        }

        .ktv-playlist-btn {
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(29,78,216,0.4);
        }

        .ktv-playlist-btn:hover {
            background: linear-gradient(135deg, #1e40af, #2563eb);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(29,78,216,0.6);
        }

        /* ===== 全新KTV播放器 - 大图片+翻页特效风格 ===== */
        .ktv-player-new {
            width: 100%;
            max-width: 700px;
            background: rgba(0, 153, 153, 0.3);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 15px;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        /* 大图片区域 - 带翻页特效 */
        .ktv-cover-area {
            width: 100%;
            height: 380px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 2px solid rgba(0,0,0,0.3);
        }

        .ktv-cover-base {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-image: url('images/beauty1.jpg');
            transition: opacity 0.3s ease;
        }

        /* 翻页特效层 */
        .ktv-cover-flip {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 100%;
            overflow: hidden;
            z-index: 5;
            transition: width 0.8s ease-in-out;
        }

        .ktv-cover-flip.flipping {
            width: 100%;
        }

        .ktv-cover-flip-inner {
            position: absolute;
            top: 0;
            right: 0;
            width: 700px;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-image: url('images/beauty2.jpg');
        }

        /* 歌曲信息叠加在图片上 */
        .ktv-song-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            z-index: 10;
        }

        .ktv-song-title-new {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            margin-bottom: 5px;
        }

        .ktv-song-artist-new {
            font-size: 16px;
            color: rgba(255,255,255,0.8);
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }

        /* KTV歌词区域 - 新版 */
        .ktv-lyrics-new {
            height: 50px;
            margin-bottom: 15px;
            position: relative;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0 15px;
            box-sizing: border-box;
        }

        .lyric-text-new {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            position: relative;
        }

        .lyric-progress-bar-new {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, rgba(30, 144, 255, 0.6), rgba(0, 191, 255, 0.6));
            width: 0%;
            z-index: 1;
            transition: width 0.1s linear;
        }

        .lyric-cursor-new {
            position: absolute;
            top: 5px;
            width: 4px;
            height: 40px;
            background: linear-gradient(180deg, #00bfff, #1e90ff);
            border-radius: 2px;
            left: 0;
            z-index: 3;
            box-shadow: 0 0 10px #00bfff, 0 0 20px rgba(0, 191, 255, 0.5);
            display: none;
            transition: left 0.1s linear;
        }

        .lyric-cursor-new.show {
            display: block;
        }

        /* 控制栏 - 新版 */
        .ktv-controls-new {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .ktv-btn-new {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .ktv-btn-new:hover {
            background: linear-gradient(135deg, rgba(0, 191, 255, 0.4), rgba(30, 144, 255, 0.3));
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 191, 255, 0.4);
        }

        .play-btn-new {
            width: 55px;
            height: 55px;
            font-size: 22px;
            background: linear-gradient(135deg, #00bfff, #1e90ff);
            box-shadow: 0 5px 20px rgba(0, 191, 255, 0.5);
        }

        .play-btn-new:hover {
            background: linear-gradient(135deg, #00d4ff, #00a0ff);
            transform: scale(1.15);
        }

        /* 进度条 - 新版 */
        .ktv-progress-new {
            flex: 1;
            min-width: 100px;
            height: 8px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }

        .ktv-progress-fill-new {
            height: 100%;
            background: linear-gradient(90deg, #00bfff, #1e90ff);
            width: 0%;
            border-radius: 4px;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
        }

        .ktv-time-new {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* 计数显示 */
        .ktv-counter-new {
            font-size: 14px;
            font-weight: bold;
            color: #00bfff;
            background: rgba(0, 191, 255, 0.15);
            padding: 5px 12px;
            border-radius: 15px;
            border: 1px solid rgba(0, 191, 255, 0.3);
            flex-shrink: 0;
        }

        .playlist-btn-new {
            background: linear-gradient(135deg, rgba(255, 165, 0, 0.3), rgba(255, 140, 0, 0.2));
        }

        .add-btn-new {
            background: linear-gradient(135deg, rgba(50, 205, 50, 0.3), rgba(34, 139, 34, 0.2));
        }

        /* 播放列表弹窗 */
        .ktv-playlist-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .ktv-playlist-modal.show {
            display: flex;
        }

        .playlist-content {
            width: 90%;
            max-width: 500px;
            max-height: 70vh;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
        }

        .playlist-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .playlist-item {
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .playlist-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .playlist-item.playing {
            background: rgba(139, 92, 246, 0.3);
            color: #a78bfa;
        }

        .playlist-close {
            text-align: center;
            margin-top: 20px;
        }

        .playlist-close button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 10px 30px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* ========== 导航页通用样式 ========== */
        .nav-page-title {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .add-site-btn-small {
            font-size: 14px;
            padding: 8px 18px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-site-btn-small:hover {
            background: rgba(139, 92, 246, 0.4);
            border-color: rgba(167, 139, 250, 0.6);
        }

        .nav-grid-large {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(2, auto);
            gap: 15px;
            width: 100%;
            max-width: 1100px;
        }

        .nav-item-large {
            background: transparent;
            backdrop-filter: none;
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
            display: block;
        }

        .nav-item-large:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);

    <script>
        // ========== 生成星星背景 ==========
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = Math.random() * 3 + 1 + 'px';
            star.style.height = star.style.width;
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }
        // ========== 生成流星 ==========
        function createMeteor() {
            const meteor = document.createElement('div');
            meteor.className = 'meteor';
            meteor.style.left = Math.random() * 80 + 20 + '%';
            meteor.style.top = Math.random() * 30 + '%';
            meteor.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            meteor.style.animationDelay = Math.random() * 0.5 + 's';
            starsContainer.appendChild(meteor);
            setTimeout(() => {
                if (meteor.parentNode) meteor.parentNode.removeChild(meteor);
            }, 4000);
        }
        function scheduleMeteor() {
            createMeteor();
            setTimeout(scheduleMeteor, Math.random() * 3000 + 3000);
        }
        setTimeout(scheduleMeteor, 2000);
        // ========== 实时时间和日期 ==========
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const timeEl = document.getElementById('timeDisplay');
            if (timeEl) timeEl.textContent = hours + ':' + minutes + ':' + seconds;
            
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekDay = weekDays[now.getDay()];
            const dateEl = document.getElementById('dateDisplay');
            if (dateEl) dateEl.textContent = year + '年' + month + '月' + day + '日 ' + weekDay;
            
            // 农历（简单版）
            const lunarEl = document.getElementById('lunarDisplay');
            if (lunarEl) {
                const lunarMonths = ['正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '冬月', '腊月'];
                const lunarDays = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十', '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十', '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];
                // 简单农历计算（近似值，实际需要复杂算法）
                const lunarMonth = lunarMonths[(month + 6) % 12];
                const lunarDay = lunarDays[(day + 12) % 30];
                lunarEl.textContent = '农历 ' + lunarMonth + lunarDay;
            }
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ========== 天气（简单显示） ==========
        const weatherEl = document.getElementById('weatherDisplay');
        if (weatherEl) {
            // 使用免费天气API（需要用户自己申请key，这里用固定显示）
            weatherEl.textContent = '🌤️ 河源 多云 22°C ~ 28°C  空气优';
        }



        // ========== 实时时间 ==========
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;
            
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekDay = weekDays[now.getDay()];
            document.getElementById('dateDisplay').textContent = `${year}年${month}月${day}日 ${weekDay}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ========== 翻书特效 ==========
        let currentPage = 0;
        const totalPages = 9;
        const pages = document.querySelectorAll('.page');
        const dots = document.querySelectorAll('.indicator-dot');
        const scrollHint = document.getElementById('scrollHint');
        let isFlipping = false;

        function goToPage(pageIndex) {
            if (pageIndex < 0 || pageIndex >= totalPages || isFlipping) return;
            
            isFlipping = true;
            const oldPage = pages[currentPage];
            const newPage = pages[pageIndex];
            
            if (pageIndex > currentPage) {
                // 往下翻：当前页往上翻走，下一页从下面翻上来
                oldPage.classList.add('flipping');
                oldPage.classList.remove('active');
                oldPage.classList.add('flipped');
                
                newPage.classList.add('next-up');
                setTimeout(() => {
                    newPage.classList.remove('next-up');
                    newPage.classList.add('active');
                }, 50);
            } else {
                // 往上翻：当前页往下翻走，上一页从上面翻下来
                oldPage.classList.add('flipping');
                oldPage.classList.remove('active');
                oldPage.classList.add('next-up');
                
                newPage.classList.add('flipped');
                setTimeout(() => {
                    newPage.classList.remove('flipped');
                    newPage.classList.add('active');
                }, 50);
            }
            
            currentPage = pageIndex;
            
            // 更新指示器
            dots.forEach((dot, index) => {
                dot.classList.remove('active');
                if (index === currentPage) {
                    dot.classList.add('active');
                }
            });
            
            // 最后一页隐藏翻页提示
            if (currentPage === totalPages - 1) {
                scrollHint.style.display = 'none';
            } else {
                scrollHint.style.display = 'block';
            }
            
            // 动画结束后重置
            setTimeout(() => {
                pages.forEach(p => p.classList.remove('flipping'));
                isFlipping = false;
            }, 800);
        }

        // 点击指示器翻页
        dots.forEach(dot => {
            dot.addEventListener('click', () => {
                const pageIndex = parseInt(dot.dataset.page);
                goToPage(pageIndex);
            });
        });

        // 鼠标滚轮翻页
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (isFlipping) return;
            
            if (e.deltaY > 0) {
                goToPage(currentPage + 1);
            } else {
                goToPage(currentPage - 1);
            }
        }, { passive: false });

        // 键盘翻页
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'PageDown') {
                goToPage(currentPage + 1);
            } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                goToPage(currentPage - 1);
            }
        });

        // 触摸翻页
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        window.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    goToPage(currentPage + 1);
                } else {
                    goToPage(currentPage - 1);
                }
            }
        });

        // ========== 搜索功能 ==========
        function doSearch(inputId) {
            const input = document.getElementById(inputId);
            const query = input.value.trim();
            if (!query) return;
            
            if (query.startsWith('http://') || query.startsWith('https://')) {
                window.open(query, '_blank');
            } else if (query.includes('.') && !query.includes(' ')) {
                window.open('https://' + query, '_blank');
            } else {
                window.open(`https://www.baidu.com/s?wd=${encodeURIComponent(query)}`, '_blank');
            }

            currentAddPage = pageNum;

        }

        // 打开编辑网站弹窗
        function openEditSiteModal(pageNum, index) {
            currentAddPage = pageNum;
            currentEditIndex = index; // 编辑模式
            const pageKey = `page${pageNum}`;
            const site = navData[pageKey][index];
            document.getElementById('newSiteName').value = site.name;
            document.getElementById('newSiteIcon').value = site.icon;
            document.getElementById('newSiteUrl').value = site.url;
            document.querySelector('.add-site-title').textContent = '✏️ 编辑网站';
            document.getElementById('addSiteModal').classList.add('show');
        }

        // 关闭添加网站弹窗
        function closeAddSiteModal() {
            document.getElementById('addSiteModal').classList.remove('show');
        }

        // 确认添加/编辑网站
        function confirmAddSite() {
            const name = document.getElementById('newSiteName').value.trim();
            const icon = document.getElementById('newSiteIcon').value.trim() || '🌐';
            let url = document.getElementById('newSiteUrl').value.trim();

            if (!name || !url) {
                alert('请填写网站名称和网站地址！');
                return;
            }

            // 如果网址没有http开头，自动加上
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const pageKey = `page${currentAddPage}`;
            if (!navData[pageKey]) {
                navData[pageKey] = [];
            }

            if (currentEditIndex >= 0) {
                // 编辑模式
                navData[pageKey][currentEditIndex] = { name, icon, url };
                alert('网站修改成功！');
            } else {
                // 添加模式
                navData[pageKey].push({ name, icon, url });
                alert('网站添加成功！');
            }

            saveNavData();
            renderNav();
            closeAddSiteModal();
        }

        // 删除网站
        function deleteSite(pageNum, index) {
            if (confirm('确定要删除这个网站吗？')) {
                const pageKey = `page${pageNum}`;
                navData[pageKey].splice(index, 1);
                saveNavData();
                renderNav();
            }
        }

        // 渲染导航
        function renderNav() {
            for (let i = 2; i <= 5; i++) {
                const grid = document.getElementById(`navGrid${i}`);
                const pageKey = `page${i}`;
                const sites = navData[pageKey] || [];
                
                grid.innerHTML = sites.map((site, index) => `
                    <div class="nav-item-large" onclick="window.open('${site.url}', '_blank')">
                        <button class="edit-site" onclick="event.stopPropagation(); openEditSiteModal(${i}, ${index})">✏️</button>
                        <button class="delete-site" onclick="event.stopPropagation(); deleteSite(${i}, ${index})">×</button>
                        <div class="site-icon">${site.icon}</div>
                        <div class="site-name">${site.name}</div>
                    </div>
                `).join('');
            }
        }
