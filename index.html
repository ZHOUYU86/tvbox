<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 粒子背景 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }

        /* 顶部信息栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .time-section {
            text-align: left;
        }

        .time-display {
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            letter-spacing: 3px;
        }

        .date-display {
            font-size: 16px;
            color: rgba(255,255,255,0.9);
            margin-top: 5px;
        }

        .weather-section {
            text-align: right;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .weather-city {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .weather-icon {
            font-size: 32px;
        }

        .weather-temp {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        .weather-desc {
            font-size: 14px;
            color: rgba(255,255,255,0.9);
        }

        /* 搜索框 */
        .search-section {
            margin-bottom: 40px;
        }

        .search-box {
            display: flex;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 5px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            font-size: 16px;
            color: #fff;
            outline: none;
        }

        .search-input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .search-btn {
            padding: 12px 30px;
            border: none;
            background: rgba(255,255,255,0.3);
            color: #fff;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: rgba(255,255,255,0.4);
        }

        /* 网址导航 */
        .nav-section {
            margin-bottom: 40px;
        }

        .nav-category {
            margin-bottom: 30px;
        }

        .category-title {
            font-size: 18px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-title .add-site-btn {
            font-size: 12px;
            padding: 4px 12px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-title .add-site-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
        }

        .nav-item {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
            text-decoration: none;
            display: block;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .nav-item .site-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .nav-item .site-name {
            font-size: 13px;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nav-item .delete-site {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            background: rgba(255,0,0,0.6);
            border: none;
            color: #fff;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .nav-item:hover .delete-site {
            display: flex;
        }

        /* 音乐播放器 - 小巧版 */
        .mini-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }

        .player-toggle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .player-toggle:hover {
            background: rgba(255,255,255,0.35);
            transform: scale(1.1);
        }

        .player-toggle.playing {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255,255,255,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }

        .player-panel {
            position: absolute;
            bottom: 60px;
            right: 0;
            width: 300px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: none;
        }

        .player-panel.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .player-panel-title {
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
        }

        .mini-song-info {
            text-align: center;
            margin-bottom: 15px;
        }

        .mini-song-title {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .mini-song-artist {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }

        .mini-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .mini-control-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .mini-control-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .mini-control-btn.play {
            width: 45px;
            height: 45px;
            font-size: 18px;
            background: rgba(255,255,255,0.3);
        }

        .mini-progress {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .mini-progress-fill {
            height: 100%;
            background: #fff;
            border-radius: 2px;
            width: 0%;
        }

        .mini-playlist {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .mini-playlist-item {
            padding: 8px 10px;
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mini-playlist-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .mini-playlist-item.playing {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }

        .mini-playlist-item .delete-mini-song {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 12px;
        }

        .add-mini-song {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .add-mini-song input {
            width: 100%;
            padding: 6px 10px;
            margin-bottom: 5px;
            border: none;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
        }

        .add-mini-song input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .add-mini-song button {
            width: 100%;
            padding: 6px;
            border: none;
            background: rgba(255,255,255,0.25);
            color: #fff;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        /* 底部 */
        .footer {
            text-align: center;
            margin-top: 50px;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .time-display {
                font-size: 32px;
            }
            .top-bar {
                flex-direction: column;
                text-align: center;
            }
            .weather-section {
                text-align: center;
            }
            .nav-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 10px;
            }
            .player-panel {
                width: calc(100vw - 40px);
                right: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <canvas id="particleCanvas"></canvas>
    
    <div class="container">
        <!-- 顶部信息栏 -->
        <div class="top-bar">
            <div class="time-section">
                <div class="time-display" id="timeDisplay">00:00:00</div>
                <div class="date-display" id="dateDisplay">加载中...</div>
            </div>
            <div class="weather-section">
                <div class="weather-city" id="weatherCity">正在定位...</div>
                <div class="weather-info">
                    <span class="weather-icon" id="weatherIcon">🌤</span>
                    <span class="weather-temp" id="weatherTemp">--°</span>
                    <span class="weather-desc" id="weatherDesc">加载中</span>
                </div>
            </div>
        </div>

        <!-- 搜索框 -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索网址或百度一下...">
                <button class="search-btn" id="searchBtn">搜索</button>
            </div>
        </div>

        <!-- 网址导航 -->
        <div class="nav-section" id="navSection">
            <!-- 动态生成 -->
        </div>

        <!-- 底部 -->
        <div class="footer">
            <p>✨ 我的导航 · 用心打造 ✨</p>
        </div>
    </div>

    <!-- 小巧音乐播放器 -->
    <div class="mini-player">
        <button class="player-toggle" id="playerToggle">🎵</button>
        <div class="player-panel" id="playerPanel">
            <div class="player-panel-title">🎵 我的音乐</div>
            <div class="mini-song-info">
                <div class="mini-song-title" id="miniSongTitle">选择一首歌曲</div>
                <div class="mini-song-artist" id="miniSongArtist">在下方添加歌曲</div>
            </div>
            <div class="mini-controls">
                <button class="mini-control-btn" id="miniPrevBtn">⏮</button>
                <button class="mini-control-btn play" id="miniPlayBtn">▶</button>
                <button class="mini-control-btn" id="miniNextBtn">⏭</button>
            </div>
            <div class="mini-progress" id="miniProgress">
                <div class="mini-progress-fill" id="miniProgressFill"></div>
            </div>
            <div class="mini-playlist" id="miniPlaylist">
                <!-- 动态生成 -->
            </div>
            <div class="add-mini-song">
                <input type="text" id="miniSongName" placeholder="歌曲名称">
                <input type="text" id="miniSongUrl" placeholder="歌曲链接(MP3)">
                <input type="text" id="miniSongArtist" placeholder="歌手（可选）">
                <button id="miniAddBtn">➕ 添加歌曲</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // ========== 动态粒子背景 ==========
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }
        
        const particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push(new Particle());
        }
        
        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 * (1 - distance / 120)})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }
        
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            connectParticles();
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ========== 实时时间 ==========
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;
            
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekDay = weekDays[now.getDay()];
            document.getElementById('dateDisplay').textContent = `${year}年${month}月${day}日 ${weekDay}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ========== 天气 ==========
        async function loadWeather() {
            try {
                // 通过IP获取城市
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();
                const city = ipData.city || '未知';
                document.getElementById('weatherCity').textContent = city;
                
                // 获取天气（用wttr.in，免费无需key）
                const weatherRes = await fetch(`https://wttr.in/${city}?format=j1&lang=zh`);
                const weatherData = await weatherRes.json();
                const current = weatherData.current_condition[0];
                const temp = current.temp_C;
                const desc = current.lang_zh[0].value || current.weatherDesc[0].value;
                const code = current.weatherCode;
                
                // 天气图标映射
                const iconMap = {
                    '113': '☀️', '116': '⛅', '119': '☁️', '122': '☁️',
                    '143': '🌫️', '176': '🌦️', '179': '🌨️', '182': '🌨️',
                    '185': '🌧️', '200': '⛈️', '227': '🌨️', '230': '❄️',
                    '248': '🌫️', '260': '🌫️', '263': '🌦️', '266': '🌧️',
                    '281': '🌧️', '284': '🌧️', '293': '🌦️', '296': '🌧️',
                    '299': '🌧️', '302': '🌧️', '305': '🌧️', '308': '🌧️',
                    '311': '🌧️', '314': '🌧️', '317': '🌨️', '320': '🌨️',
                    '323': '🌨️', '326': '🌨️', '329': '❄️', '332': '❄️',
                    '335': '❄️', '338': '❄️', '350': '🌨️', '353': '🌦️',
                    '356': '🌧️', '359': '🌧️', '362': '🌨️', '365': '🌨️',
                    '368': '❄️', '371': '❄️', '374': '🌨️', '377': '🌨️',
                    '386': '⛈️', '389': '⛈️', '392': '⛈️', '395': '❄️'
                };
                
                document.getElementById('weatherIcon').textContent = iconMap[code] || '🌤️';
                document.getElementById('weatherTemp').textContent = `${temp}°`;
                document.getElementById('weatherDesc').textContent = desc;
            } catch (e) {
                document.getElementById('weatherCity').textContent = '天气加载失败';
                document.getElementById('weatherDesc').textContent = '请检查网络';
            }
        }
        loadWeather();

        // ========== 搜索 ==========
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        
        function doSearch() {
            const query = searchInput.value.trim();
            if (!query) return;
            // 如果是网址直接打开，否则百度搜索
            if (query.startsWith('http://') || query.startsWith('https://')) {
                window.open(query, '_blank');
            } else if (query.includes('.') && !query.includes(' ')) {
                window.open('https://' + query, '_blank');
            } else {
                window.open(`https://www.baidu.com/s?wd=${encodeURIComponent(query)}`, '_blank');
            }
        }
        
        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        // ========== 网址导航 ==========
        // 默认分类和网站
        const defaultNav = {
            '🎬 影视娱乐': [
                { name: '百度', icon: '🔍', url: 'https://www.baidu.com' },
                { name: '爱奇艺', icon: '🎬', url: 'https://www.iqiyi.com' },
                { name: '腾讯视频', icon: '🎬', url: 'https://v.qq.com' },
                { name: '优酷', icon: '🎬', url: 'https://www.youku.com' },
                { name: 'B站', icon: '📺', url: 'https://www.bilibili.com' },
                { name: '抖音', icon: '🎵', url: 'https://www.douyin.com' }
            ],
            '🛒 购物消费': [
                { name: '淘宝', icon: '🛒', url: 'https://www.taobao.com' },
                { name: '京东', icon: '🛒', url: 'https://www.jd.com' },
                { name: '拼多多', icon: '🛒', url: 'https://www.pinduoduo.com' },
                { name: '天猫', icon: '🛒', url: 'https://www.tmall.com' }
            ],
            '📱 社交通讯': [
                { name: '微信', icon: '💬', url: 'https://weixin.qq.com' },
                { name: 'QQ', icon: '💬', url: 'https://im.qq.com' },
                { name: '微博', icon: '📱', url: 'https://weibo.com' },
                { name: '知乎', icon: '❓', url: 'https://www.zhihu.com' }
            ],
            '🔧 实用工具': [
                { name: '百度网盘', icon: '☁️', url: 'https://pan.baidu.com' },
                { name: '12306', icon: '🚄', url: 'https://www.12306.cn' },
                { name: '高德地图', icon: '🗺️', url: 'https://www.amap.com' },
                { name: '翻译', icon: '🌐', url: 'https://fanyi.baidu.com' }
            ]
        };
        
        let navData = JSON.parse(localStorage.getItem('navData')) || defaultNav;
        
        function saveNav() {
            localStorage.setItem('navData', JSON.stringify(navData));
        }
        
        function renderNav() {
            const navSection = document.getElementById('navSection');
            navSection.innerHTML = '';
            
            Object.keys(navData).forEach(category => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'nav-category';
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.innerHTML = `
                    <span>${category}</span>
                    <button class="add-site-btn" onclick="addSite('${category}')">➕ 添加</button>
                    <button class="add-site-btn" onclick="deleteCategory('${category}')">🗑 删除分类</button>
                `;
                categoryDiv.appendChild(titleDiv);
                
                const gridDiv = document.createElement('div');
                gridDiv.className = 'nav-grid';
                
                navData[category].forEach((site, index) => {
                    const siteDiv = document.createElement('a');
                    siteDiv.className = 'nav-item';
                    siteDiv.href = site.url;
                    siteDiv.target = '_blank';
                    siteDiv.innerHTML = `
                        <button class="delete-site" onclick="event.preventDefault(); event.stopPropagation(); deleteSite('${category}', ${index})">×</button>
                        <div class="site-icon">${site.icon || '🌐'}</div>
                        <div class="site-name">${site.name}</div>
                    `;
                    gridDiv.appendChild(siteDiv);
                });
                
                categoryDiv.appendChild(gridDiv);
                navSection.appendChild(categoryDiv);
            });
            
            // 添加分类按钮
            const addCategoryDiv = document.createElement('div');
            addCategoryDiv.style.marginTop = '20px';
            addCategoryDiv.style.textAlign = 'center';
            addCategoryDiv.innerHTML = `
                <button onclick="addCategory()" style="padding: 10px 30px; background: rgba(255,255,255,0.2); border: 1px dashed rgba(255,255,255,0.5); color: #fff; border-radius: 20px; cursor: pointer; font-size: 14px;">
                    ➕ 添加新分类
                </button>
            `;
            navSection.appendChild(addCategoryDiv);
        }
        
        window.addSite = function(category) {
            const name = prompt('请输入网站名称：');
            if (!name) return;
            const url = prompt('请输入网站地址（如 https://www.baidu.com）：');
            if (!url) return;
            const icon = prompt('请输入图标（emoji，如 🌐，可留空）：') || '🌐';
            
            if (!navData[category]) navData[category] = [];
            navData[category].push({ name, url, icon });
            saveNav();
            renderNav();
        };
        
        window.deleteSite = function(category, index) {
            if (confirm('确定要删除这个网站吗？')) {
                navData[category].splice(index, 1);
                saveNav();
                renderNav();
            }
        };
        
        window.addCategory = function() {
            const name = prompt('请输入分类名称（如 🎬 影视娱乐）：');
            if (!name) return;
            if (navData[name]) {
                alert('该分类已存在！');
                return;
            }
            navData[name] = [];
            saveNav();
            renderNav();
        };
        
        window.deleteCategory = function(category) {
            if (confirm(`确定要删除分类"${category}"吗？该分类下的所有网站都会被删除！`)) {
                delete navData[category];
                saveNav();
                renderNav();
            }
        };
        
        renderNav();

        // ========== 小巧音乐播放器 ==========
        const audio = document.getElementById('audioPlayer');
        const playerToggle = document.getElementById('playerToggle');
        const playerPanel = document.getElementById('playerPanel');
        const miniPlayBtn = document.getElementById('miniPlayBtn');
        const miniPrevBtn = document.getElementById('miniPrevBtn');
        const miniNextBtn = document.getElementById('miniNextBtn');
        const miniProgress = document.getElementById('miniProgress');
        const miniProgressFill = document.getElementById('miniProgressFill');
        const miniSongTitle = document.getElementById('miniSongTitle');
        const miniSongArtist = document.getElementById('miniSongArtist');
        const miniPlaylist = document.getElementById('miniPlaylist');
        const miniAddBtn = document.getElementById('miniAddBtn');
        const miniSongName = document.getElementById('miniSongName');
        const miniSongUrl = document.getElementById('miniSongUrl');
        const miniSongArtistInput = document.getElementById('miniSongArtist');
        
        let miniPlaylistData = JSON.parse(localStorage.getItem('miniPlaylist')) || [];
        let miniCurrentIndex = -1;
        let miniIsPlaying = false;
        
        // 切换播放器面板
        playerToggle.addEventListener('click', () => {
            playerPanel.classList.toggle('show');
        });
        
        // 渲染播放列表
        function renderMiniPlaylist() {
            if (miniPlaylistData.length === 0) {
                miniPlaylist.innerHTML = '<div style="text-align:center; color:rgba(255,255,255,0.5); padding:15px; font-size:12px;">还没有歌曲，在下方添加吧！</div>';
                return;
            }
            miniPlaylist.innerHTML = miniPlaylistData.map((song, index) => `
                <div class="mini-playlist-item ${index === miniCurrentIndex ? 'playing' : ''}" onclick="playMiniSong(${index})">
                    <span>${index + 1}. ${song.name} ${song.artist ? '- ' + song.artist : ''}</span>
                    <button class="delete-mini-song" onclick="event.stopPropagation(); deleteMiniSong(${index})">🗑</button>
                </div>
            `).join('');
        }
        
        // 播放歌曲
        window.playMiniSong = function(index) {
            if (index < 0 || index >= miniPlaylistData.length) return;
            miniCurrentIndex = index;
            const song = miniPlaylistData[index];
            audio.src = song.url;
            audio.play();
            miniIsPlaying = true;
            miniPlayBtn.textContent = '⏸';
            miniSongTitle.textContent = song.name;
            miniSongArtist.textContent = song.artist || '未知歌手';
            playerToggle.classList.add('playing');
            playerToggle.textContent = '🎶';
            renderMiniPlaylist();
            saveMiniPlaylist();
        };
        
        // 播放/暂停
        miniPlayBtn.addEventListener('click', () => {
            if (miniCurrentIndex === -1 && miniPlaylistData.length > 0) {
                playMiniSong(0);
                return;
            }
            if (miniIsPlaying) {
                audio.pause();
                miniPlayBtn.textContent = '▶';
                playerToggle.classList.remove('playing');
                playerToggle.textContent = '🎵';
            } else {
                audio.play();
                miniPlayBtn.textContent = '⏸';
                playerToggle.classList.add('playing');
                playerToggle.textContent = '🎶';
            }
            miniIsPlaying = !miniIsPlaying;
        });
        
        // 上一首
        miniPrevBtn.addEventListener('click', () => {
            if (miniPlaylistData.length === 0) return;
            const newIndex = (miniCurrentIndex - 1 + miniPlaylistData.length) % miniPlaylistData.length;
            playMiniSong(newIndex);
        });
        
        // 下一首
        miniNextBtn.addEventListener('click', () => {
            if (miniPlaylistData.length === 0) return;
            const newIndex = (miniCurrentIndex + 1) % miniPlaylistData.length;
            playMiniSong(newIndex);
        });
        
        // 进度条
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                miniProgressFill.style.width = percent + '%';
            }
        });
        
        miniProgress.addEventListener('click', (e) => {
            const rect = miniProgress.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = percent * audio.duration;
            }
        });
        
        // 歌曲结束自动下一首
        audio.addEventListener('ended', () => {
            if (miniPlaylistData.length > 0) {
                const newIndex = (miniCurrentIndex + 1) % miniPlaylistData.length;
                playMiniSong(newIndex);
            }
        });
        
        // 添加歌曲
        miniAddBtn.addEventListener('click', () => {
            const name = miniSongName.value.trim();
            const url = miniSongUrl.value.trim();
            const artist = miniSongArtistInput.value.trim();
            
            if (!name || !url) {
                alert('请填写歌曲名称和歌曲链接！');
                return;
            }
            
            miniPlaylistData.push({ name, url, artist });
            saveMiniPlaylist();
            renderMiniPlaylist();
            
            miniSongName.value = '';
            miniSongUrl.value = '';
            miniSongArtistInput.value = '';
            
            alert('歌曲添加成功！');
        });
        
        // 删除歌曲
        window.deleteMiniSong = function(index) {
            if (confirm('确定要删除这首歌曲吗？')) {
                miniPlaylistData.splice(index, 1);
                if (miniCurrentIndex === index) {
                    audio.pause();
                    audio.src = '';
                    miniIsPlaying = false;
                    miniPlayBtn.textContent = '▶';
                    miniCurrentIndex = -1;
                    miniSongTitle.textContent = '选择一首歌曲';
                    miniSongArtist.textContent = '在下方添加歌曲';
                    playerToggle.classList.remove('playing');
                    playerToggle.textContent = '🎵';
                } else if (miniCurrentIndex > index) {
                    miniCurrentIndex--;
                }
                saveMiniPlaylist();
                renderMiniPlaylist();
            }
        };
        
        // 保存
        function saveMiniPlaylist() {
            localStorage.setItem('miniPlaylist', JSON.stringify(miniPlaylistData));
        }
        
        renderMiniPlaylist();
    </script>
</body>
</html>
