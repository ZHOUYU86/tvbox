<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
        }

        body {
            background: #0a0a1a;
            color: #fff;
            position: relative;
        }

        /* 动态背景 - 慢慢转动的光晕 */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: rotateGlow 20s linear infinite;
        }

        .bg-glow:nth-child(1) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #6b21a8, transparent);
            top: -200px;
            left: -200px;
            animation-duration: 25s;
        }

        .bg-glow:nth-child(2) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #1e40af, transparent);
            bottom: -150px;
            right: -150px;
            animation-duration: 30s;
            animation-direction: reverse;
        }

        .bg-glow:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #be185d, transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 35s;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* 星星背景 */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 页面容器 */
        .pages-container {
            position: relative;
            z-index: 1;
            height: 100vh;
            overflow: hidden;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.6s ease;
            pointer-events: none;
        }

        .page.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* 翻页指示器 */
        .page-indicator {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .indicator-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .indicator-dot.active {
            background: #a78bfa;
            border-color: #fff;
            transform: scale(1.3);
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.6);
        }

        .indicator-dot:hover {
            background: rgba(255,255,255,0.6);
        }

        /* ========== 第一页：时间 + 音乐播放器 ========== */
        .time-display-large {
            font-size: 120px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 40px rgba(167, 139, 250, 0.5);
            letter-spacing: 10px;
            margin-bottom: 10px;
        }

        .date-display-large {
            font-size: 24px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 50px;
            letter-spacing: 3px;
        }

        /* KTV风格音乐播放器 */
        .ktv-player {
            width: 100%;
            max-width: 800px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .ktv-song-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .ktv-song-title {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .ktv-song-artist {
            font-size: 18px;
            color: rgba(255,255,255,0.6);
        }

        /* KTV歌词显示 */
        .ktv-lyrics {
            height: 120px;
            overflow: hidden;
            margin-bottom: 30px;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
        }

        .lyrics-container {
            transition: transform 0.5s ease;
        }

        .lyric-line {
            height: 40px;
            line-height: 40px;
            text-align: center;
            font-size: 22px;
            color: rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }

        .lyric-line.active {
            color: #fff;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.8);
        }

        .lyric-line.next {
            color: rgba(255,255,255,0.5);
        }

        /* 播放控制 */
        .ktv-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
        }

        .ktv-control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .ktv-control-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }

        .ktv-control-btn.play-btn {
            width: 70px;
            height: 70px;
            font-size: 28px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        .ktv-control-btn.play-btn:hover {
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.6);
        }

        /* 进度条 */
        .ktv-progress {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 15px;
            position: relative;
        }

        .ktv-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #6366f1);
            border-radius: 3px;
            width: 0%;
            position: relative;
        }

        .ktv-progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.8);
        }

        .ktv-time {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }

        /* 播放列表按钮 */
        .ktv-playlist-toggle {
            text-align: center;
        }

        .ktv-playlist-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: rgba(255,255,255,0.7);
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .ktv-playlist-btn:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }

        /* 播放列表弹窗 */
        .ktv-playlist-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .ktv-playlist-modal.show {
            display: flex;
        }

        .playlist-content {
            width: 90%;
            max-width: 500px;
            max-height: 70vh;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
        }

        .playlist-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .playlist-item {
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .playlist-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .playlist-item.playing {
            background: rgba(139, 92, 246, 0.3);
            color: #a78bfa;
        }

        .playlist-close {
            text-align: center;
            margin-top: 20px;
        }

        .playlist-close button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 10px 30px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* ========== 导航页通用样式 ========== */
        .nav-page-title {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
        }

        .nav-grid-large {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .nav-item-large {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
            display: block;
        }

        .nav-item-large:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
            border-color: rgba(167, 139, 250, 0.5);
        }

        .nav-item-large .site-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .nav-item-large .site-name {
            font-size: 15px;
            color: #fff;
        }

        /* 搜索框 */
        .search-box-large {
            display: flex;
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .search-input-large {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            font-size: 16px;
            color: #fff;
            outline: none;
        }

        .search-input-large::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .search-btn-large {
            padding: 12px 30px;
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: #fff;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn-large:hover {
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        /* 翻页提示 */
        .scroll-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            z-index: 50;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .time-display-large {
                font-size: 60px;
                letter-spacing: 5px;
            }
            .ktv-player {
                padding: 20px;
            }
            .ktv-song-title {
                font-size: 24px;
            }
            .lyric-line {
                font-size: 18px;
            }
            .lyric-line.active {
                font-size: 20px;
            }
            .nav-grid-large {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 15px;
            }
            .nav-item-large .site-icon {
                font-size: 30px;
            }
            .nav-page-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <!-- 动态背景 -->
    <div class="bg-container">
        <div class="bg-glow"></div>
        <div class="bg-glow"></div>
        <div class="bg-glow"></div>
        <div class="stars" id="stars"></div>
    </div>

    <!-- 翻页指示器 -->
    <div class="page-indicator" id="pageIndicator">
        <div class="indicator-dot active" data-page="0" title="首页"></div>
        <div class="indicator-dot" data-page="1" title="影视娱乐"></div>
        <div class="indicator-dot" data-page="2" title="购物生活"></div>
        <div class="indicator-dot" data-page="3" title="社交通讯"></div>
        <div class="indicator-dot" data-page="4" title="实用工具"></div>
    </div>

    <!-- 翻页提示 -->
    <div class="scroll-hint" id="scrollHint">↓ 滚动鼠标翻页 ↓</div>

    <!-- 页面容器 -->
    <div class="pages-container">
        <!-- 第1页：时间 + KTV音乐播放器 -->
        <div class="page active" id="page0">
            <div class="time-display-large" id="timeDisplay">00:00:00</div>
            <div class="date-display-large" id="dateDisplay">加载中...</div>
            
            <div class="ktv-player">
                <div class="ktv-song-info">
                    <div class="ktv-song-title" id="ktvSongTitle">选择一首歌曲</div>
                    <div class="ktv-song-artist" id="ktvSongArtist">点击下方播放列表</div>
                </div>
                
                <div class="ktv-lyrics">
                    <div class="lyrics-container" id="lyricsContainer">
                        <div class="lyric-line">🎵 欢迎使用KTV音乐播放器 🎵</div>
                        <div class="lyric-line active">添加歌曲，开始享受音乐吧！</div>
                        <div class="lyric-line next">点击右下角播放列表添加歌曲</div>
                    </div>
                </div>
                
                <div class="ktv-controls">
                    <button class="ktv-control-btn" id="ktvPrevBtn">⏮</button>
                    <button class="ktv-control-btn play-btn" id="ktvPlayBtn">▶</button>
                    <button class="ktv-control-btn" id="ktvNextBtn">⏭</button>
                </div>
                
                <div class="ktv-progress" id="ktvProgress">
                    <div class="ktv-progress-fill" id="ktvProgressFill"></div>
                </div>
                
                <div class="ktv-time">
                    <span id="ktvCurrentTime">00:00</span>
                    <span id="ktvTotalTime">00:00</span>
                </div>
                
                <div class="ktv-playlist-toggle">
                    <button class="ktv-playlist-btn" id="ktvPlaylistBtn">📋 播放列表</button>
                </div>
            </div>
        </div>

        <!-- 第2页：影视娱乐 -->
        <div class="page" id="page1">
            <div class="nav-page-title">🎬 影视娱乐</div>
            <div class="search-box-large">
                <input type="text" class="search-input-large" id="searchInput2" placeholder="搜索影视或百度一下...">
                <button class="search-btn-large" onclick="doSearch('searchInput2')">搜索</button>
            </div>
            <div class="nav-grid-large" id="navGrid2"></div>
        </div>

        <!-- 第3页：购物生活 -->
        <div class="page" id="page2">
            <div class="nav-page-title">🛒 购物生活</div>
            <div class="search-box-large">
                <input type="text" class="search-input-large" id="searchInput3" placeholder="搜索商品或百度一下...">
                <button class="search-btn-large" onclick="doSearch('searchInput3')">搜索</button>
            </div>
            <div class="nav-grid-large" id="navGrid3"></div>
        </div>

        <!-- 第4页：社交通讯 -->
        <div class="page" id="page3">
            <div class="nav-page-title">📱 社交通讯</div>
            <div class="search-box-large">
                <input type="text" class="search-input-large" id="searchInput4" placeholder="搜索或百度一下...">
                <button class="search-btn-large" onclick="doSearch('searchInput4')">搜索</button>
            </div>
            <div class="nav-grid-large" id="navGrid4"></div>
        </div>

        <!-- 第5页：实用工具 -->
        <div class="page" id="page4">
            <div class="nav-page-title">🔧 实用工具</div>
            <div class="search-box-large">
                <input type="text" class="search-input-large" id="searchInput5" placeholder="搜索或百度一下...">
                <button class="search-btn-large" onclick="doSearch('searchInput5')">搜索</button>
            </div>
            <div class="nav-grid-large" id="navGrid5"></div>
        </div>
    </div>

    <!-- 播放列表弹窗 -->
    <div class="ktv-playlist-modal" id="playlistModal">
        <div class="playlist-content">
            <div class="playlist-title">🎵 播放列表</div>
            <div id="playlistItems"></div>
            <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                <input type="text" id="addSongName" placeholder="歌曲名称" style="width:100%; padding:10px; margin-bottom:8px; background:rgba(255,255,255,0.1); border:none; color:#fff; border-radius:8px; outline:none;">
                <input type="text" id="addSongUrl" placeholder="歌曲链接(MP3)" style="width:100%; padding:10px; margin-bottom:8px; background:rgba(255,255,255,0.1); border:none; color:#fff; border-radius:8px; outline:none;">
                <input type="text" id="addSongArtist" placeholder="歌手（可选）" style="width:100%; padding:10px; margin-bottom:10px; background:rgba(255,255,255,0.1); border:none; color:#fff; border-radius:8px; outline:none;">
                <button onclick="addSong()" style="width:100%; padding:10px; background:linear-gradient(135deg,#8b5cf6,#6366f1); border:none; color:#fff; border-radius:8px; cursor:pointer;">➕ 添加歌曲</button>
            </div>
            <div class="playlist-close">
                <button onclick="closePlaylist()">关闭</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // ========== 生成星星背景 ==========
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = Math.random() * 3 + 1 + 'px';
            star.style.height = star.style.width;
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        // ========== 实时时间 ==========
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;
            
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekDay = weekDays[now.getDay()];
            document.getElementById('dateDisplay').textContent = `${year}年${month}月${day}日 ${weekDay}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ========== 翻页功能 ==========
        let currentPage = 0;
        const totalPages = 5;
        const pages = document.querySelectorAll('.page');
        const dots = document.querySelectorAll('.indicator-dot');
        const scrollHint = document.getElementById('scrollHint');

        function goToPage(pageIndex) {
            if (pageIndex < 0 || pageIndex >= totalPages) return;
            currentPage = pageIndex;
            
            pages.forEach((page, index) => {
                page.classList.remove('active');
                if (index === currentPage) {
                    page.classList.add('active');
                }
            });
            
            dots.forEach((dot, index) => {
                dot.classList.remove('active');
                if (index === currentPage) {
                    dot.classList.add('active');
                }
            });
            
            // 最后一页隐藏翻页提示
            if (currentPage === totalPages - 1) {
                scrollHint.style.display = 'none';
            } else {
                scrollHint.style.display = 'block';
            }
        }

        // 点击指示器翻页
        dots.forEach(dot => {
            dot.addEventListener('click', () => {
                const pageIndex = parseInt(dot.dataset.page);
                goToPage(pageIndex);
            });
        });

        // 鼠标滚轮翻页
        let isScrolling = false;
        window.addEventListener('wheel', (e) => {
            if (isScrolling) return;
            isScrolling = true;
            
            if (e.deltaY > 0) {
                goToPage(currentPage + 1);
            } else {
                goToPage(currentPage - 1);
            }
            
            setTimeout(() => { isScrolling = false; }, 800);
        });

        // 键盘翻页
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'PageDown') {
                goToPage(currentPage + 1);
            } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                goToPage(currentPage - 1);
            }
        });

        // 触摸翻页
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });
        window.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    goToPage(currentPage + 1);
                } else {
                    goToPage(currentPage - 1);
                }
            }
        });

        // ========== 搜索功能 ==========
        function doSearch(inputId) {
            const input = document.getElementById(inputId);
            const query = input.value.trim();
            if (!query) return;
            
            if (query.startsWith('http://') || query.startsWith('https://')) {
                window.open(query, '_blank');
            } else if (query.includes('.') && !query.includes(' ')) {
                window.open('https://' + query, '_blank');
            } else {
                window.open(`https://www.baidu.com/s?wd=${encodeURIComponent(query)}`, '_blank');
            }
        }

        // 搜索框回车
        ['searchInput2', 'searchInput3', 'searchInput4', 'searchInput5'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', (e) => {
                if (e.key === 'Enter') doSearch(id);
            });
        });

        // ========== 网址导航数据 ==========

            ],

            ],
            page4: [

        // 渲染导航
        function renderNav() {
            for (let i = 2; i <= 5; i++) {
                const grid = document.getElementById(`navGrid${i}`);
                const pageKey = `page${i}`;
                const sites = navData[pageKey] || [];
                
                grid.innerHTML = sites.map(site => `
                    <a href="${site.url}" target="_blank" class="nav-item-large">
                        <div class="site-icon">${site.icon}</div>
                        <div class="site-name">${site.name}</div>
                    </a>
                `).join('');
            }
        }
        renderNav();

        // ========== KTV音乐播放器 ==========
        const audio = document.getElementById('audioPlayer');
        const ktvPlayBtn = document.getElementById('ktvPlayBtn');
        const ktvPrevBtn = document.getElementById('ktvPrevBtn');
        const ktvNextBtn = document.getElementById('ktvNextBtn');
        const ktvProgress = document.getElementById('ktvProgress');
        const ktvProgressFill = document.getElementById('ktvProgressFill');
        const ktvCurrentTime = document.getElementById('ktvCurrentTime');
        const ktvTotalTime = document.getElementById('ktvTotalTime');
        const ktvSongTitle = document.getElementById('ktvSongTitle');
        const ktvSongArtist = document.getElementById('ktvSongArtist');
        const lyricsContainer = document.getElementById('lyricsContainer');
        const playlistModal = document.getElementById('playlistModal');
        const playlistItems = document.getElementById('playlistItems');

        let playlist = JSON.parse(localStorage.getItem('ktvPlaylist')) || [];
        let currentSongIndex = -1;
        let isPlaying = false;

        // 格式化时间
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // 播放歌曲
        function playSong(index) {
            if (index < 0 || index >= playlist.length) return;
            currentSongIndex = index;
            const song = playlist[index];
            
            audio.src = song.url;
            audio.play();
            isPlaying = true;
            ktvPlayBtn.textContent = '⏸';
            ktvSongTitle.textContent = song.name;
            ktvSongArtist.textContent = song.artist || '未知歌手';
            
            // 更新歌词（简单模拟，实际应该解析LRC）
            updateLyrics(song.name);
            
            // 更新播放列表高亮
            renderPlaylist();
            savePlaylist();
        }

        // 更新歌词显示（简单模拟）
        function updateLyrics(songName) {
            const mockLyrics = [
                '🎵 正在播放：' + songName,
                '♪ 旋律在空气中飘荡 ♪',
                '♪ 音符在心里跳动 ♪',
                '♪ 让我们一起享受音乐 ♪',
                '♪ 感受每一个节拍 ♪',
                '♪ 沉浸在美妙的旋律中 ♪',
                '🎵 音乐让生活更美好 🎵'
            ];
            
            lyricsContainer.innerHTML = mockLyrics.map((line, i) => 
                `<div class="lyric-line ${i === 1 ? 'active' : ''} ${i === 2 ? 'next' : ''}">${line}</div>`
            ).join('');
        }

        // 播放/暂停
        ktvPlayBtn.addEventListener('click', () => {
            if (currentSongIndex === -1 && playlist.length > 0) {
                playSong(0);
                return;
            }
            if (isPlaying) {
                audio.pause();
                ktvPlayBtn.textContent = '▶';
            } else {
                audio.play();
                ktvPlayBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        });

        // 上一首
        ktvPrevBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            const newIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            playSong(newIndex);
        });

        // 下一首
        ktvNextBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            const newIndex = (currentSongIndex + 1) % playlist.length;
            playSong(newIndex);
        });

        // 进度条
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                ktvProgressFill.style.width = percent + '%';
                ktvCurrentTime.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            ktvTotalTime.textContent = formatTime(audio.duration);
        });

        ktvProgress.addEventListener('click', (e) => {
            const rect = ktvProgress.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = percent * audio.duration;
            }
        });

        // 歌曲结束自动下一首
        audio.addEventListener('ended', () => {
            if (playlist.length > 0) {
                const newIndex = (currentSongIndex + 1) % playlist.length;
                playSong(newIndex);
            }
        });

        // 播放列表
        function renderPlaylist() {
            if (playlist.length === 0) {
                playlistItems.innerHTML = '<div style="text-align:center; color:rgba(255,255,255,0.5); padding:20px;">还没有歌曲，在下方添加吧！</div>';
                return;
            }
            
            playlistItems.innerHTML = playlist.map((song, index) => `
                <div class="playlist-item ${index === currentSongIndex ? 'playing' : ''}" onclick="playSong(${index})">
                    <span>${index + 1}. ${song.name} ${song.artist ? '- ' + song.artist : ''}</span>
                    <button onclick="event.stopPropagation(); deleteSong(${index})" style="background:none; border:none; color:rgba(255,255,255,0.5); cursor:pointer;">🗑</button>
                </div>
            `).join('');
        }

        // 打开播放列表
        document.getElementById('ktvPlaylistBtn').addEventListener('click', () => {
            playlistModal.classList.add('show');
            renderPlaylist();
        });

        // 关闭播放列表
        function closePlaylist() {
            playlistModal.classList.remove('show');
        }

        // 添加歌曲
        function addSong() {
            const name = document.getElementById('addSongName').value.trim();
            const url = document.getElementById('addSongUrl').value.trim();
            const artist = document.getElementById('addSongArtist').value.trim();
            
            if (!name || !url) {
                alert('请填写歌曲名称和歌曲链接！');
                return;
            }
            
            playlist.push({ name, url, artist });
            savePlaylist();
            renderPlaylist();
            
            document.getElementById('addSongName').value = '';
            document.getElementById('addSongUrl').value = '';
            document.getElementById('addSongArtist').value = '';
            
            alert('歌曲添加成功！');
        }

        // 删除歌曲
        function deleteSong(index) {
            if (confirm('确定要删除这首歌曲吗？')) {
                playlist.splice(index, 1);
                if (currentSongIndex === index) {
                    audio.pause();
                    audio.src = '';
                    isPlaying = false;
                    ktvPlayBtn.textContent = '▶';
                    currentSongIndex = -1;
                    ktvSongTitle.textContent = '选择一首歌曲';
                    ktvSongArtist.textContent = '点击下方播放列表';
                } else if (currentSongIndex > index) {
                    currentSongIndex--;
                }
                savePlaylist();
                renderPlaylist();
            }
        }

        // 保存播放列表
        function savePlaylist() {
            localStorage.setItem('ktvPlaylist', JSON.stringify(playlist));
        }

        // 初始化
        renderPlaylist();
    </script>
