<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #006064 0%, #00838f 25%, #00acc1 50%, #26c6da 75%, #00bcd4 100%);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: #fff;
            position: relative;
        }

        /* 颗粒感噪点层 - 加强版 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='5' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.35;
            z-index: 1;
            pointer-events: none;
        }

        /* 动态背景 - 慢慢转动的光晕 */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: rotateGlow 20s linear infinite;
        }

        .bg-glow:nth-child(1) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #006064, transparent);
            top: -200px;
            left: -200px;
            animation-duration: 25s;
        }

        .bg-glow:nth-child(2) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #00acc1, transparent);
            bottom: -150px;
            right: -150px;
            animation-duration: 30s;
            animation-direction: reverse;
        }

        .bg-glow:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #4dd0e1, transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 35s;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* 星星背景 */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 页面容器 - 翻书特效 */
        .pages-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            perspective: 2000px;
            overflow: hidden;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: inherit;
            transform-origin: top center;
            transform: rotateX(0deg) translateZ(0);
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.8s ease;
            backface-visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .page.active {
            opacity: 1;
            transform: rotateX(0deg) translateZ(0);
            pointer-events: auto;
            z-index: 10;
        }

        .page.flipped {
            opacity: 0;
            transform: rotateX(-180deg) translateZ(-100px);
            z-index: 5;
        }

        .page.next-up {
            opacity: 0;
            transform: rotateX(180deg) translateZ(-100px);
            z-index: 5;
        }

        /* 翻页阴影效果 */
        .page::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent 30%);
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }

        .page.flipping::after {
            opacity: 1;
        }

        /* 翻页指示器 */
        .page-indicator {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .indicator-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .indicator-dot.active {
            background: #a78bfa;
            border-color: #fff;
            transform: scale(1.3);
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.6);
        }

        .indicator-dot:hover {
            background: rgba(255,255,255,0.6);
        }

        /* ========== 第一页：时间 + 音乐播放器 ========== */
        .time-display-large {
            font-size: 72px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.5);
            letter-spacing: 6px;
            margin-bottom: 5px;
        }

        .date-display-large {
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* KTV风格音乐播放器 - 缩小版 */
        .ktv-player {
            width: 100%;
            max-width: 550px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        /* 图片轮播区域 - 缩小版 */
        .ktv-image-slider {
            width: 100%;
            height: 220px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .slider-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.8s ease, transform 5s ease;
            transform: scale(1);
        }

        .slider-image.active {
            opacity: 1;
            transform: scale(1.08);
        }

        /* 图片切换闪烁效果 */
        .slider-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .slider-flash.flash {
            animation: flashEffect 0.5s ease;
        }

        @keyframes flashEffect {
            0% { opacity: 0; }
            50% { opacity: 0.6; }
            100% { opacity: 0; }
        }

        .ktv-song-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .ktv-song-title {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .ktv-song-artist {
            font-size: 18px;
            color: rgba(255,255,255,0.6);
        }

        /* KTV歌词显示 - 超简单可靠版 */
        .ktv-lyrics {
            height: 45px;
            margin-bottom: 15px;
            position: relative;
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        /* 歌词文字 - 白色，肯定能看见 */
        .lyric-text {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            padding: 0 15px;
            white-space: nowrap;
            position: relative;
            z-index: 1;
            width: 100%;
            text-align: center;
        }

        /* 蓝色唱过进度条 - 从左往右慢慢跑 */
        .lyric-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(29,78,216,0.5), rgba(59,130,246,0.3));
            z-index: 2;
        }

        /* 蓝色光标 - 跟着进度条跑 */
        .lyric-cursor {
            position: absolute;
            top: 5px;
            bottom: 5px;
            width: 4px;
            background: #1d4ed8;
            box-shadow: 0 0 12px #1d4ed8, 0 0 20px rgba(29,78,216,0.6);
            border-radius: 2px;
            left: 0;
            z-index: 3;
            display: none;
        }

        .lyric-cursor.show {
            display: block;
        }

        /* 播放控制 */
        .ktv-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
        }

        .ktv-control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .ktv-control-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }

        .ktv-control-btn.play-btn {
            width: 70px;
            height: 70px;
            font-size: 28px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        .ktv-control-btn.play-btn:hover {
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.6);
        }

        /* 进度条 */
        .ktv-progress {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 15px;
            position: relative;
        }

        .ktv-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #6366f1);
            border-radius: 3px;
            width: 0%;
            position: relative;
        }

        .ktv-progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.8);
        }

        .ktv-time {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }

        /* 播放列表按钮 */
        .ktv-playlist-toggle {
            text-align: center;
        }

        .ktv-playlist-btn {
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(29,78,216,0.4);
        }

        .ktv-playlist-btn:hover {
            background: linear-gradient(135deg, #1e40af, #2563eb);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(29,78,216,0.6);
        }

        /* 播放列表弹窗 */
        .ktv-playlist-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .ktv-playlist-modal.show {
            display: flex;
        }

        .playlist-content {
            width: 90%;
            max-width: 500px;
            max-height: 70vh;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
        }

        .playlist-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .playlist-item {
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .playlist-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .playlist-item.playing {
            background: rgba(139, 92, 246, 0.3);
            color: #a78bfa;
        }

        .playlist-close {
            text-align: center;
            margin-top: 20px;
        }

        .playlist-close button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 10px 30px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* ========== 导航页通用样式 ========== */
        .nav-page-title {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .add-site-btn-small {
            font-size: 14px;
            padding: 8px 18px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-site-btn-small:hover {
            background: rgba(139, 92, 246, 0.4);
            border-color: rgba(167, 139, 250, 0.6);
        }

        .nav-grid-large {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(2, auto);
            gap: 15px;
            width: 100%;
            max-width: 1100px;
        }

        .nav-item-large {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
            display: block;
        }

        .nav-item-large:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
            border-color: rgba(167, 139, 250, 0.5);
        }

        .nav-item-large .site-icon {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .nav-item-large .site-name {
            font-size: 12px;
            color: #fff;
        }

        .nav-item-large .delete-site {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.8);
            border: none;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .nav-item-large .edit-site {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.9);
            border: none;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .nav-item-large:hover .delete-site,
        .nav-item-large:hover .edit-site {
            display: flex;
        }

        .nav-item-large {
            position: relative;
        }

        .add-site-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px dashed rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
        }

        .add-site-card:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(167, 139, 250, 0.6);
        }

        .add-site-card .add-icon {
            font-size: 36px;
            margin-bottom: 5px;
        }

        .add-site-card .add-text {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
        }

        /* 添加网站弹窗 */
        .add-site-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 300;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .add-site-modal.show {
            display: flex;
        }

        .add-site-content {
            width: 90%;
            max-width: 400px;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .add-site-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .add-site-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .add-site-content input:focus {
            border-color: #8b5cf6;
        }

        .add-site-content input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .add-site-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .add-site-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: #fff;
        }

        .btn-confirm:hover {
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .btn-cancel:hover {
            background: rgba(255,255,255,0.2);
        }

        /* 搜索框 */
        .search-box-large {
            display: flex;
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .search-input-large {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            font-size: 16px;
            color: #fff;
            outline: none;
        }

        .search-input-large::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .search-btn-large {
            padding: 12px 30px;
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: #fff;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn-large:hover {
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        /* 翻页提示 */
        .scroll-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            z-index: 50;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .time-display-large {
                font-size: 60px;
                letter-spacing: 5px;
            }
            .ktv-player {
                padding: 20px;
            }
            .ktv-song-title {
                font-size: 24px;
            }
            .lyric-line {
                font-size: 18px;
            }
            .lyric-line.active {
                font-size: 20px;
            }
            .nav-grid-large {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
                max-width: 100%;
            }
            .nav-item-large {
                padding: 12px 8px;
                border-radius: 12px;
            }
            .nav-item-large .site-icon {
                font-size: 24px;
            }
            .nav-item-large .site-name {
                font-size: 11px;
            }
            .nav-page-title {
                font-size: 24px;
            }
            .page {
                padding: 20px 15px;
            }
            .ktv-player {
                max-width: 100%;
                padding: 15px;
            }
            .time-display-large {
                font-size: 48px;
                letter-spacing: 3px;
            }
            .ktv-image-slider {
                height: 160px;
            }
        }
    </style>
</head>
<body>
    <!-- 动态背景 -->
    <div class="bg-container">
        <div class="bg-glow"></div>
        <div class="bg-glow"></div>
        <div class="bg-glow"></div>
        <div class="stars" id="stars"></div>
    </div>

    <!-- 页面容器 -->
    <div class="pages-container">
        <!-- 第1页：时间 + KTV音乐播放器 -->

    <script>
        // ========== 生成星星背景 ==========
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = Math.random() * 3 + 1 + 'px';
            star.style.height = star.style.width;
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        // ========== 实时时间 ==========
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;
            
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekDay = weekDays[now.getDay()];
            document.getElementById('dateDisplay').textContent = `${year}年${month}月${day}日 ${weekDay}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ========== 翻书特效 ==========
        let currentPage = 0;
        const totalPages = 10;
        const pages = document.querySelectorAll('.page');
        const dots = document.querySelectorAll('.indicator-dot');
        const scrollHint = document.getElementById('scrollHint');
        let isFlipping = false;

        function goToPage(pageIndex) {
            if (pageIndex < 0 || pageIndex >= totalPages || isFlipping) return;
            
            isFlipping = true;
            const oldPage = pages[currentPage];
            const newPage = pages[pageIndex];
            
            if (pageIndex > currentPage) {
                // 往下翻：当前页往上翻走，下一页从下面翻上来
                oldPage.classList.add('flipping');
                oldPage.classList.remove('active');
                oldPage.classList.add('flipped');
                
                newPage.classList.add('next-up');
                setTimeout(() => {
                    newPage.classList.remove('next-up');
                    newPage.classList.add('active');
                }, 50);
            } else {
                // 往上翻：当前页往下翻走，上一页从上面翻下来
                oldPage.classList.add('flipping');
                oldPage.classList.remove('active');
                oldPage.classList.add('next-up');
                
                newPage.classList.add('flipped');
                setTimeout(() => {
                    newPage.classList.remove('flipped');
                    newPage.classList.add('active');
                }, 50);
            }
            
            currentPage = pageIndex;
            
            // 更新指示器
            dots.forEach((dot, index) => {
                dot.classList.remove('active');
                if (index === currentPage) {
                    dot.classList.add('active');
                }
            });
            
            // 最后一页隐藏翻页提示
            if (currentPage === totalPages - 1) {
                scrollHint.style.display = 'none';
            } else {
                scrollHint.style.display = 'block';
            }
            
            // 动画结束后重置
            setTimeout(() => {
                pages.forEach(p => p.classList.remove('flipping'));
                isFlipping = false;
            }, 800);
        }

        // 点击指示器翻页
        dots.forEach(dot => {
            dot.addEventListener('click', () => {
                const pageIndex = parseInt(dot.dataset.page);
                goToPage(pageIndex);
            });
        });

        // 鼠标滚轮翻页
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (isFlipping) return;
            
            if (e.deltaY > 0) {
                goToPage(currentPage + 1);
            } else {
                goToPage(currentPage - 1);
            }
        }, { passive: false });

        // 键盘翻页
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'PageDown') {
                goToPage(currentPage + 1);
            } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                goToPage(currentPage - 1);
            }
        });

        // 触摸翻页
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        window.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    goToPage(currentPage + 1);
                } else {
                    goToPage(currentPage - 1);
                }
            }
        });

        // ========== 搜索功能 ==========
        function doSearch(inputId) {
            const input = document.getElementById(inputId);
            const query = input.value.trim();
            if (!query) return;
            
            if (query.startsWith('http://') || query.startsWith('https://')) {
                window.open(query, '_blank');
            } else if (query.includes('.') && !query.includes(' ')) {
                window.open('https://' + query, '_blank');
            } else {
                window.open(`https://www.baidu.com/s?wd=${encodeURIComponent(query)}`, '_blank');
            }
        }

        // 搜索框回车

                if (currentLrcIndex >= 0) {
                    const lineStartTime = currentLrc[currentLrcIndex].time;
                    const lineEndTime = (currentLrcIndex + 1 < currentLrc.length) 
                        ? currentLrc[currentLrcIndex + 1].time 
                        : audio.duration;
                    const lineDuration = lineEndTime - lineStartTime;
                    const lineProgress = lineDuration > 0 
                        ? Math.min(100, ((currentTime - lineStartTime) / lineDuration) * 100)
                        : 0;
                    
                    // 蓝色进度条和光标在句子里从左往右跑
                    progressBar.style.width = lineProgress + '%';
                    const boxWidth = lyricsBox.offsetWidth;
                    cursor.style.left = (lineProgress / 100) * boxWidth + 'px';
                    cursor.classList.add('show');
                }
            } else {
                // 没有LRC歌词，用整体进度
                const progress = (currentTime / audio.duration) * 100;
                progressBar.style.width = progress + '%';
                const boxWidth = lyricsBox.offsetWidth;
                cursor.style.left = (progress / 100) * boxWidth + 'px';
                cursor.classList.add('show');
            }
        }

        // 播放/暂停
        ktvPlayBtn.addEventListener('click', () => {
            if (currentSongIndex === -1 && playlist.length > 0) {
                playSong(0);
                return;
            }
            if (isPlaying) {
                audio.pause();
                ktvPlayBtn.textContent = '▶';
            } else {
                audio.play();
                ktvPlayBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        });

        // 上一首
        ktvPrevBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            const newIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            playSong(newIndex);
        });

        // 下一首
        ktvNextBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            const newIndex = (currentSongIndex + 1) % playlist.length;
            playSong(newIndex);
        });

        // 进度条
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                ktvProgressFill.style.width = percent + '%';
                ktvCurrentTime.textContent = formatTime(audio.currentTime);
                // 更新KTV字幕效果
                updateKtvLyricProgress();
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            ktvTotalTime.textContent = formatTime(audio.duration);
        });

        ktvProgress.addEventListener('click', (e) => {
            const rect = ktvProgress.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = percent * audio.duration;
            }
        });

        // 歌曲结束自动下一首
        audio.addEventListener('ended', () => {
            if (playlist.length > 0) {
                const newIndex = (currentSongIndex + 1) % playlist.length;
                playSong(newIndex);
            }
        });

        // 播放列表
        function renderPlaylist() {
            if (playlist.length === 0) {
                playlistItems.innerHTML = '<div style="text-align:center; color:rgba(255,255,255,0.5); padding:20px;">还没有歌曲，在下方添加吧！</div>';
                return;
            }
            
            playlistItems.innerHTML = playlist.map((song, index) => `
                <div class="playlist-item ${index === currentSongIndex ? 'playing' : ''}" onclick="playSong(${index})">
                    <span>${index + 1}. ${song.name} ${song.artist ? '- ' + song.artist : ''}</span>
                    <button onclick="event.stopPropagation(); deleteSong(${index})" style="background:none; border:none; color:rgba(255,255,255,0.5); cursor:pointer;">🗑</button>
                </div>
            `).join('');
        }

        // 打开播放列表
        document.getElementById('ktvPlaylistBtn').addEventListener('click', () => {
            playlistModal.classList.add('show');
            renderPlaylist();
        });

        // 关闭播放列表
        function closePlaylist() {
            playlistModal.classList.remove('show');
        }

        // 添加歌曲
        function addSong() {
            const name = document.getElementById('addSongName').value.trim();
            const url = document.getElementById('addSongUrl').value.trim();
            const artist = document.getElementById('addSongArtist').value.trim();
            const lrc = document.getElementById('addSongLrc').value.trim();
            
            if (!name || !url) {
                alert('请填写歌曲名称和歌曲链接！');
                return;
            }
            
            playlist.push({ name, url, artist, lrc });
            savePlaylist();
            renderPlaylist();
            
            document.getElementById('addSongName').value = '';
            document.getElementById('addSongUrl').value = '';
            document.getElementById('addSongArtist').value = '';
            document.getElementById('addSongLrc').value = '';
            
            alert('歌曲添加成功！' + (lrc ? '已包含LRC歌词，可实现KTV效果！' : ''));
        }

        // 解析LRC歌词
        function parseLrc(lrcText) {
            if (!lrcText) return [];
            const lines = lrcText.split('\n');
            const result = [];
            const timeReg = /\[(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?\]/g;
            
            for (const line of lines) {
                const matches = [...line.matchAll(timeReg)];
                const text = line.replace(timeReg, '').trim();
                if (!text) continue;
                
                for (const match of matches) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseInt(match[2]);
                    const ms = match[3] ? parseInt(match[3].padEnd(3, '0')) : 0;
                    const time = minutes * 60 + seconds + ms / 1000;
                    result.push({ time, text });
                }
            }
            
            return result.sort((a, b) => a.time - b.time);
        }

        // 当前播放的LRC歌词
        let currentLrc = [];
        let currentLrcIndex = -1;

        // 删除歌曲
        function deleteSong(index) {
            if (confirm('确定要删除这首歌曲吗？')) {
                playlist.splice(index, 1);
                if (currentSongIndex === index) {
                    audio.pause();
                    audio.src = '';
                    isPlaying = false;
                    ktvPlayBtn.textContent = '▶';
                    currentSongIndex = -1;
                    ktvSongTitle.textContent = '选择一首歌曲';
                    ktvSongArtist.textContent = '点击下方播放列表';
                } else if (currentSongIndex > index) {
                    currentSongIndex--;
                }
                savePlaylist();
                renderPlaylist();
            }
        }

        // 保存播放列表
        function savePlaylist() {
            localStorage.setItem('ktvPlaylist', JSON.stringify(playlist));
        }

        // 初始化
        renderPlaylist();
    </script>
</body>
</html>
