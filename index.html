<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, #006064 0%, #00838f 25%, #00acc1 50%, #26c6da 75%, #00bcd4 100%);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: #fff;
            position: relative;
        }

        /* 颗粒感噪点层 - 加强版 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='5' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.35;
            z-index: 1;
            pointer-events: none;
        }

        /* 动态背景 - 慢慢转动的光晕 */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: rotateGlow 20s linear infinite;
        }

        .bg-glow:nth-child(1) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #006064, transparent);
            top: -200px;
            left: -200px;
            animation-duration: 25s;
        }

        .bg-glow:nth-child(2) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #00acc1, transparent);
            bottom: -150px;
            right: -150px;
            animation-duration: 30s;
            animation-direction: reverse;
        }

        .bg-glow:nth-child(3) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #4dd0e1, transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 35s;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* 星星背景 */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 页面容器 - 普通滚动 */
        .pages-container {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 40px;
        }

        /* 翻页指示器 */
        .page-indicator {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .indicator-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .indicator-dot.active {
            background: #a78bfa;
            border-color: #fff;
            transform: scale(1.3);
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.6);
        }

        .indicator-dot:hover {
            background: rgba(255,255,255,0.6);
        }

        /* ========== 第一页：时间 + 音乐播放器 ========== */
        .time-display-large {
            font-size: 120px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 40px rgba(167, 139, 250, 0.5);
            letter-spacing: 10px;
            margin-bottom: 10px;
        }

        .date-display-large {
            font-size: 24px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 50px;
            letter-spacing: 3px;
        }

        /* KTV风格音乐播放器 */
        .ktv-player {
            width: 100%;
            max-width: 800px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .ktv-song-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .ktv-song-title {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .ktv-song-artist {
            font-size: 18px;
            color: rgba(255,255,255,0.6);
        }

        /* KTV歌词显示 */
        .ktv-lyrics {
            height: 120px;
            overflow: hidden;
            margin-bottom: 30px;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
        }

        .lyrics-container {
            transition: transform 0.5s ease;
        }

        .lyric-line {
            height: 40px;
            line-height: 40px;
            text-align: center;
            font-size: 20px;
            color: rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            position: relative;
            display: block;
        }

        .lyric-line.active {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(167, 139, 250, 0.6);
        }

        .lyric-line.next {
            color: rgba(255,255,255,0.5);
        }

        /* 当前行的KTV光标效果 */
        .lyric-line.active .ktv-line-inner {
            position: relative;
            display: inline-block;
        }

        .lyric-line.active .ktv-line-inner::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: var(--progress, 0%);
            height: 100%;
            color: #3b82f6;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
            overflow: hidden;
            white-space: nowrap;
        }

        /* 蓝色光标 */
        .lyric-cursor {
            position: absolute;
            width: 3px;
            height: 28px;
            background: #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
            border-radius: 2px;
            top: 50%;
            transform: translateY(-50%);
            left: 0;
            z-index: 10;
            display: none;
        }

        .lyric-line.active .lyric-cursor {
            display: block;
        }

        /* 播放控制 */
        .ktv-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
        }

        .ktv-control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .ktv-control-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }

        .ktv-control-btn.play-btn {
            width: 70px;
            height: 70px;
            font-size: 28px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        .ktv-control-btn.play-btn:hover {
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.6);
        }

        /* 进度条 */
        .ktv-progress {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 15px;
            position: relative;
        }

        .ktv-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #6366f1);
            border-radius: 3px;
            width: 0%;
            position: relative;
        }

        .ktv-progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.8);
        }

        .ktv-time {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }

        /* 播放列表按钮 */
        .ktv-playlist-toggle {
            text-align: center;
        }

        .ktv-playlist-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: rgba(255,255,255,0.7);
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .ktv-playlist-btn:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }

        /* 播放列表弹窗 */
        .ktv-playlist-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .ktv-playlist-modal.show {
            display: flex;
        }

        .playlist-content {
            width: 90%;
            max-width: 500px;
            max-height: 70vh;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
        }

        .playlist-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .playlist-item {
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .playlist-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .playlist-item.playing {
            background: rgba(139, 92, 246, 0.3);
            color: #a78bfa;
        }

        .playlist-close {
            text-align: center;
            margin-top: 20px;
        }

        .playlist-close button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 10px 30px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* ========== 导航页通用样式 ========== */
        .nav-page-title {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .add-site-btn-small {
            font-size: 14px;
            padding: 8px 18px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-site-btn-small:hover {
            background: rgba(139, 92, 246, 0.4);
            border-color: rgba(167, 139, 250, 0.6);
        }

        .nav-grid-large {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .nav-item-large {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
            display: block;
        }

        .nav-item-large:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
            border-color: rgba(167, 139, 250, 0.5);
        }

        .nav-item-large .site-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .nav-item-large .site-name {
            font-size: 15px;
            color: #fff;
        }

        .nav-item-large .delete-site {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.8);
            border: none;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .nav-item-large .edit-site {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.9);
            border: none;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .nav-item-large:hover .delete-site,
        .nav-item-large:hover .edit-site {
            display: flex;
        }

        .nav-item-large {
            position: relative;
        }

        .add-site-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px dashed rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
        }

        .add-site-card:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(167, 139, 250, 0.6);
        }

        .add-site-card .add-icon {
            font-size: 36px;
            margin-bottom: 5px;
        }

        .add-site-card .add-text {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
        }

        /* 添加网站弹窗 */
        .add-site-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 300;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .add-site-modal.show {
            display: flex;
        }

        .add-site-content {
            width: 90%;
            max-width: 400px;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .add-site-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .add-site-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .add-site-content input:focus {
            border-color: #8b5cf6;
        }

        .add-site-content input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .add-site-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .add-site-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: #fff;
        }

        .btn-confirm:hover {
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .btn-cancel:hover {
            background: rgba(255,255,255,0.2);
        }

        /* 搜索框 */
        .search-box-large {
            display: flex;
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .search-input-large {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            font-size: 16px;
            color: #fff;
            outline: none;
        }

        .search-input-large::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .search-btn-large {
            padding: 12px 30px;
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: #fff;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn-large:hover {
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        /* 翻页提示 */
        .scroll-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            z-index: 50;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .time-display-large {
                font-size: 60px;
                letter-spacing: 5px;
            }
            .ktv-player {
                padding: 20px;
            }
            .ktv-song-title {
                font-size: 24px;
            }
            .lyric-line {
                font-size: 18px;
            }
            .lyric-line.active {
                font-size: 20px;
            }
            .nav-grid-large {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 15px;
            }
            .nav-item-large .site-icon {
                font-size: 30px;
            }
            .nav-page-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <!-- 动态背景 -->
    <div class="bg-container">
        <div class="bg-glow"></div>
        <div class="bg-glow"></div>
        <div class="bg-glow"></div>
        <div class="stars" id="stars"></div>
    </div>

    <!-- 页面容器 -->
    <div class="pages-container">
        <!-- 第1页：时间 + KTV音乐播放器 -->
        <div class="page active" id="page0">
            <div class="time-display-large" id="timeDisplay">00:00:00</div>
            <div class="date-display-large" id="dateDisplay">加载中...</div>
            
            <div class="ktv-player">
                <div class="ktv-song-info">
                    <div class="ktv-song-title" id="ktvSongTitle">选择一首歌曲</div>
                    <div class="ktv-song-artist" id="ktvSongArtist">点击下方播放列表</div>
                </div>
                
                <div class="ktv-lyrics">
                    <div class="lyrics-container" id="lyricsContainer">
                        <div class="lyric-line">🎵 欢迎使用KTV音乐播放器 🎵</div>
                        <div class="lyric-line active">
                            <span class="ktv-line-inner" data-text="添加歌曲，开始享受音乐吧！">添加歌曲，开始享受音乐吧！</span>
                            <span class="lyric-cursor"></span>
                        </div>
                        <div class="lyric-line next">点击播放列表添加歌曲</div>
                    </div>
                </div>
                
                <div class="ktv-controls">
                    <button class="ktv-control-btn" id="ktvPrevBtn">⏮</button>
                    <button class="ktv-control-btn play-btn" id="ktvPlayBtn">▶</button>
                    <button class="ktv-control-btn" id="ktvNextBtn">⏭</button>
                </div>
                
                <div class="ktv-progress" id="ktvProgress">
                    <div class="ktv-progress-fill" id="ktvProgressFill"></div>
                </div>
                
                <div class="ktv-time">
                    <span id="ktvCurrentTime">00:00</span>
                    <span id="ktvTotalTime">00:00</span>
                </div>
                
                <div class="ktv-playlist-toggle">
                    <button class="ktv-playlist-btn" id="ktvPlaylistBtn">📋 播放列表</button>
                </div>
            </div>
        </div>

        <!-- 第2页：影视娱乐 -->
        <div class="page" id="page1">
            <div class="nav-page-title">🎬 影视娱乐 <button class="add-site-btn-small" onclick="openAddSiteModal(2)">➕ 添加</button></div>
            <div class="search-box-large">
                <input type="text" class="search-input-large" id="searchInput2" placeholder="搜索影视或百度一下...">
                <button class="search-btn-large" onclick="doSearch('searchInput2')">搜索</button>
            </div>
            <div class="nav-grid-large" id="navGrid2"></div>
        </div>

        <!-- 第3页：购物生活 -->
        <div class="page" id="page2">
            <div class="nav-page-title">🛒 购物生活 <button class="add-site-btn-small" onclick="openAddSiteModal(3)">➕ 添加</button></div>
            <div class="search-box-large">
                <input type="text" class="search-input-large" id="searchInput3" placeholder="搜索商品或百度一下...">
                <button class="search-btn-large" onclick="doSearch('searchInput3')">搜索</button>
            </div>

        // ========== 生成星星背景 ==========

        // ========== 实时时间 ==========
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;
            
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekDay = weekDays[now.getDay()];
            document.getElementById('dateDisplay').textContent = `${year}年${month}月${day}日 ${weekDay}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ========== 丝滑滚动效果 ==========
        let currentScrollY = window.scrollY;
        let targetScrollY = window.scrollY;
        let isSmoothScrolling = false;
        const smoothStrength = 0.08; // 滚动平滑度，越小越丝滑

        // 拦截鼠标滚轮，实现丝滑滚动
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            targetScrollY += e.deltaY;
            // 限制滚动范围
            targetScrollY = Math.max(0, Math.min(targetScrollY, document.body.scrollHeight - window.innerHeight));
            
            if (!isSmoothScrolling) {
                isSmoothScrolling = true;
                smoothScrollLoop();
            }
        }, { passive: false });

        // 丝滑滚动循环
        function smoothScrollLoop() {
            currentScrollY += (targetScrollY - currentScrollY) * smoothStrength;
            
            // 接近目标时停止
            if (Math.abs(targetScrollY - currentScrollY) < 0.5) {
                currentScrollY = targetScrollY;
                isSmoothScrolling = false;
            }
            
            window.scrollTo(0, currentScrollY);
            
            if (isSmoothScrolling) {
                requestAnimationFrame(smoothScrollLoop);
            }
        }

        // 触摸滑动支持
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            const touchCurrentY = e.touches[0].clientY;
            const diff = touchStartY - touchCurrentY;
            targetScrollY += diff * 0.5;
            targetScrollY = Math.max(0, Math.min(targetScrollY, document.body.scrollHeight - window.innerHeight));
            touchStartY = touchCurrentY;
            
            if (!isSmoothScrolling) {
                isSmoothScrolling = true;
                smoothScrollLoop();
            }
        }, { passive: true });

        // 当前要添加网站的页码

        function openEditSiteModal(pageNum, index) {

        function confirmAddSite() {
            const name = document.getElementById('newSiteName').value.trim();
            const icon = document.getElementById('newSiteIcon').value.trim() || '🌐';
            let url = document.getElementById('newSiteUrl').value.trim();

            if (!name || !url) {

                return;
            }

            // 如果网址没有http开头，自动加上
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const pageKey = `page${currentAddPage}`;
            if (!navData[pageKey]) {
                navData[pageKey] = [];
            }

            if (currentEditIndex >= 0) {
                // 编辑模式
                navData[pageKey][currentEditIndex] = { name, icon, url };
                alert('网站修改成功！');
            } else {

        // ========== KTV音乐播放器 ==========

        const ktvPrevBtn = document.getElementById('ktvPrevBtn');
        const ktvNextBtn = document.getElementById('ktvNextBtn');
        const ktvProgress = document.getElementById('ktvProgress');
        const ktvProgressFill = document.getElementById('ktvProgressFill');
        const ktvCurrentTime = document.getElementById('ktvCurrentTime');
        const ktvTotalTime = document.getElementById('ktvTotalTime');
        const ktvSongTitle = document.getElementById('ktvSongTitle');

        let playlist = JSON.parse(localStorage.getItem('ktvPlaylist')) || [];
        let currentSongIndex = -1;
        let isPlaying = false;

        // 格式化时间
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        // 播放歌曲
        function playSong(index) {
            if (index < 0 || index >= playlist.length) return;
            currentSongIndex = index;
            const song = playlist[index];
            
            audio.src = song.url;
            audio.play();
            isPlaying = true;
            ktvPlayBtn.textContent = '⏸';
            ktvSongTitle.textContent = song.name;
            ktvSongArtist.textContent = song.artist || '未知歌手';
            
            // 更新歌词（简单模拟，实际应该解析LRC）
            updateLyrics(song.name);
            
            // 更新播放列表高亮
            renderPlaylist();
            savePlaylist();
        }

        // 更新歌词显示（KTV效果，一行显示）
        function updateLyrics(songName) {
            const lyricLine = document.getElementById('ktvLyricLine');
            const text = `🎵 ${songName} - 正在播放 🎵`;
            lyricLine.textContent = text;
            lyricLine.setAttribute('data-text', text);
            // 重置进度
            lyricLine.style.setProperty('--progress', '0%');
            document.querySelector('.lyric-line::after').style.width = '0%';
        }

        // 更新KTV字幕进度（蓝色光标和唱过层）
        function updateKtvLyricProgress() {
            const lyricLine = document.getElementById('ktvLyricLine');
            const cursor = document.getElementById('lyricCursor');
            
            if (!audio.duration || !isPlaying) {
                cursor.classList.remove('show');
                return;
            }
            
            const progress = (audio.currentTime / audio.duration) * 100;
            
            // 更新蓝色唱过层
            lyricLine.style.setProperty('--progress', progress + '%');
            // 用JavaScript直接设置after伪元素的宽度
            const style = document.createElement('style');
            style.textContent = `.lyric-line::after { width: ${progress}% !important; }`;
            // 移除旧的style
            const oldStyle = document.getElementById('ktvLyricStyle');
            if (oldStyle) oldStyle.remove();
            style.id = 'ktvLyricStyle';
            document.head.appendChild(style);
            
            // 更新蓝色光标位置
            const lineWidth = lyricLine.offsetWidth - 40; // 减去padding
            const cursorLeft = 20 + (progress / 100) * lineWidth;
            cursor.style.left = cursorLeft + 'px';
            cursor.classList.add('show');
        }

        // 播放/暂停
        ktvPlayBtn.addEventListener('click', () => {
            if (currentSongIndex === -1 && playlist.length > 0) {
                playSong(0);
                return;
            }
            if (isPlaying) {
                audio.pause();
                ktvPlayBtn.textContent = '▶';
            } else {
                audio.play();
                ktvPlayBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        });

        // 上一首
        ktvPrevBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            const newIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            playSong(newIndex);
        });

        // 下一首
        ktvNextBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            const newIndex = (currentSongIndex + 1) % playlist.length;
            playSong(newIndex);
        });

        // 进度条
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                ktvProgressFill.style.width = percent + '%';
                ktvCurrentTime.textContent = formatTime(audio.currentTime);
                // 更新KTV字幕效果
                updateKtvLyricProgress();
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            ktvTotalTime.textContent = formatTime(audio.duration);
        });

        ktvProgress.addEventListener('click', (e) => {
            const rect = ktvProgress.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = percent * audio.duration;
            }
        });

        // 歌曲结束自动下一首
        audio.addEventListener('ended', () => {
            if (playlist.length > 0) {
                const newIndex = (currentSongIndex + 1) % playlist.length;
                playSong(newIndex);
            }
        });

        // 播放列表
        function renderPlaylist() {
            if (playlist.length === 0) {
                playlistItems.innerHTML = '<div style="text-align:center; color:rgba(255,255,255,0.5); padding:20px;">还没有歌曲，在下方添加吧！</div>';
                return;
            }
            
            playlistItems.innerHTML = playlist.map((song, index) => `
                <div class="playlist-item ${index === currentSongIndex ? 'playing' : ''}" onclick="playSong(${index})">
                    <span>${index + 1}. ${song.name} ${song.artist ? '- ' + song.artist : ''}</span>
                    <button onclick="event.stopPropagation(); deleteSong(${index})" style="background:none; border:none; color:rgba(255,255,255,0.5); cursor:pointer;">🗑</button>
                </div>
            `).join('');
        }

        // 打开播放列表
        document.getElementById('ktvPlaylistBtn').addEventListener('click', () => {
            playlistModal.classList.add('show');
            renderPlaylist();
        });

        // 关闭播放列表
        function closePlaylist() {
            playlistModal.classList.remove('show');
        }

        // 添加歌曲
        function addSong() {
            const name = document.getElementById('addSongName').value.trim();
            const url = document.getElementById('addSongUrl').value.trim();
            const artist = document.getElementById('addSongArtist').value.trim();
            
            if (!name || !url) {
                alert('请填写歌曲名称和歌曲链接！');
                return;
            }
            
            playlist.push({ name, url, artist });
            savePlaylist();
            renderPlaylist();
            
            document.getElementById('addSongName').value = '';
            document.getElementById('addSongUrl').value = '';
            document.getElementById('addSongArtist').value = '';
            
            alert('歌曲添加成功！');
        }

        // 删除歌曲
        function deleteSong(index) {
            if (confirm('确定要删除这首歌曲吗？')) {
                playlist.splice(index, 1);
                if (currentSongIndex === index) {
                    audio.pause();
                    audio.src = '';
                    isPlaying = false;
                    ktvPlayBtn.textContent = '▶';
                    currentSongIndex = -1;
                    ktvSongTitle.textContent = '选择一首歌曲';
                    ktvSongArtist.textContent = '点击下方播放列表';
                } else if (currentSongIndex > index) {
                    currentSongIndex--;
                }
                savePlaylist();
                renderPlaylist();
            }
        }

        // 保存播放列表
        function savePlaylist() {
            localStorage.setItem('ktvPlaylist', JSON.stringify(playlist));
        }

        // 初始化
        renderPlaylist();
    </script>
</body>
</html>
